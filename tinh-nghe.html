      $('#dictCmp').innerHTML = out || '<span class="muted">Chưa gõ gì.</span>';
    };
  },0);
  return c;
}

/* ============================================================
   ✂️ POPUP CHỌN VĂN BẢN  (Lưu thẻ / Ghi chú / Highlight)
   ============================================================ */
let lastSelText='', lastSelRange=null, lastSelEditor=null;
function enableSelectionPopup(el){
  el.addEventListener('mouseup',e=>showSelPop(e,el));
  el.addEventListener('contextmenu',e=>{ const s=window.getSelection(); if(s&&s.toString().trim()){ e.preventDefault(); showSelPop(e,el);} });
}
function showSelPop(e,el){
  const sel=window.getSelection(); const txt=sel?sel.toString().trim():'';
  const pop=$('#selpop');
  if(!txt){ pop.classList.remove('show'); return; }
  lastSelText=txt; lastSelEditor=el;
  try{ lastSelRange=sel.getRangeAt(0).cloneRange(); }catch(_){ lastSelRange=null; }
  const isEditable = el.isContentEditable;
  const canNote = el.id==='transcriptEditor' || el.id==='translationEditor';
  const isVocabField = el.id==='vf_word' || el.id==='vf_usage'; // đang ở trong khung Sửa thẻ — không cần nút "lưu thẻ mới"
  pop.innerHTML=`
    ${isEditable?`
    <button data-cmd="bold" title="Đậm"><b>B</b></button>
    <button data-cmd="italic" title="Nghiêng"><i>I</i></button>
    <button data-cmd="underline" title="Gạch chân"><u>U</u></button>
    <span class="selpop-sep"></span>
    <button data-cmd="insertUnorderedList" title="Danh sách chấm">•≡</button>
    <button data-cmd="insertOrderedList" title="Danh sách số">1.≡</button>
    <span class="selpop-sep"></span>
    <span class="mini-sw" id="selpopHl" title="Màu nền" style="background:#FFF1A8"></span>
    <span class="mini-sw" id="selpopFc" title="Màu chữ" style="background:#fff"></span>
    <button data-a="paint" title="Sao chép định dạng">🖌</button>
    <span class="selpop-sep"></span>`:''}
    ${!isVocabField?`<button data-a="vocab">🔖 Lưu thẻ</button>`:''}
    ${canNote?`<button data-a="note">📝 Ghi chú</button>`:''}`;
  pop.style.left=(Math.min(e.pageX, window.scrollX+window.innerWidth-260))+'px';
  pop.style.top =(e.pageY-46)+'px';
  pop.classList.add('show');
  pop.querySelector('[data-a="vocab"]')?.addEventListener('click',()=>{ pop.classList.remove('show'); openVocabForm({word:txt}); });
  const nb=pop.querySelector('[data-a="note"]');
  if(nb) nb.onclick=()=>{ pop.classList.remove('show'); addNoteFromSelection(); };
  const pb=pop.querySelector('[data-a="paint"]');
  if(pb) pb.addEventListener('mousedown',ev=>{ ev.preventDefault(); restoreSel(); pop.classList.remove('show'); togglePaintMode([$('#tb2Paint')]); });
  pop.querySelectorAll('[data-cmd]').forEach(b=>{
    b.addEventListener('mousedown',ev=>{
      ev.preventDefault(); restoreSel(); el.focus();
      document.execCommand('styleWithCSS',false,true);
      document.execCommand(b.dataset.cmd,false,null);
      fireInput(el);
    });
  });
  const hlSw=$('#selpopHl'), fcSw=$('#selpopFc');
  if(hlSw) hlSw.addEventListener('mousedown',ev=>{ ev.preventDefault(); restoreSel(); el.focus(); openColorPop('hl',hlSw); pop.classList.remove('show'); });
  if(fcSw) fcSw.addEventListener('mousedown',ev=>{ ev.preventDefault(); restoreSel(); el.focus(); openColorPop('fc',fcSw); pop.classList.remove('show'); });
}
function restoreSel(){ if(!lastSelRange)return; const s=window.getSelection(); s.removeAllRanges(); s.addRange(lastSelRange); }
// bọc vùng chọn vào 1 thẻ span (chịu được khi vùng chọn trải nhiều dòng)
function wrapSelection(range,className,data){
  const span=document.createElement('span'); span.className=className;
  Object.entries(data||{}).forEach(([k,v])=>span.dataset[k]=v);
  try{ range.surroundContents(span); }
  catch(_){ const frag=range.extractContents(); span.appendChild(frag); range.insertNode(span); }
  return span;
}
document.addEventListener('mousedown',e=>{ if(!e.target.closest('#selpop')) $('#selpop').classList.remove('show'); });

function addNoteFromSelection(){
  const item=findItem(currentItemId); if(!item || !lastSelRange || !lastSelEditor)return;
  const id='note_'+uid();
  const span=wrapSelection(lastSelRange,'note-hit',{noteid:id});
  const ed=span.closest('.editor'); if(ed) saveEditor(ed);
  item.notes.push({id, excerpt:lastSelText, bodyHtml:''}); saveMeta();
  openDrawer('right'); switchRTab('notes'); renderNotes(); openNote(id);
  toast('Đã thêm ghi chú.');
}

/* ============================================================
   🔖 THẺ TỪ VỰNG  (CRUD + form có định dạng)
   ============================================================ */
const VFIELDS=[
  ['word','Từ (chữ Hán) *','han'],
  ['content','Cách dùng, ví dụ, nghĩa…','area'],
];
const APP_LABEL='🎧 Luyện nghe'; // nhãn app này dùng khi ghi vào "occurrences" của kho từ vựng chung

/* ---------- Bước 2b: cơ chế "nhớ đường về" dùng chung giữa 5 app ---------- */
/* NAV_STACK_KEY, APP_FILE_MAP, navPushAndGo/navBack/navDismiss/renderNavBackPill: xem shared-nav.js (dùng chung cả 4 app) */
function goToOccurrence(occ,word){
  if(occ.app===APP_LABEL){ if(findItem(occ.itemId)) openItem(occ.itemId); if(word) setTimeout(()=>jumpToVocab(word),80); return; }
  const file=APP_FILE_MAP[occ.app];
  if(!file){ toast("Không xác định được app đích"); return; }
  navPushAndGo(file+"?open="+encodeURIComponent(occ.itemId)+(word?"&word="+encodeURIComponent(word):""));
}
let editingVocabId=null;
let lastHl='#FFF1A8';

/* occFor, extractWordStyle, wordStyleCSS: xem shared-vocab.js (dùng chung cả 4 app) */
function renderVocab(filter=''){
  const list=$('#vocabList'); list.innerHTML='';
  const f=filter.trim().toLowerCase();
  // Chỉ hiện những từ THẬT SỰ CÓ xuất hiện trong bài đang mở — không hiện hết toàn bộ kho
  // chung (giống cách app Đọc/Nói vẫn làm), đỡ rối khi kho có nhiều từ nhưng bài này không dùng tới.
  const inThisItem=state.vocab.filter(v=>(v.occurrences||[]).some(o=>o.itemId===currentItemId));
  const badge=$('#vocabCountBadge'); if(badge) badge.textContent=inThisItem.length?`(${inThisItem.length})`:'';
  const arr=inThisItem.filter(v=>!f || (v.word||'').toLowerCase().includes(f)
    || (v.pinyin||'').toLowerCase().includes(f) || (v.vi||'').toLowerCase().includes(f));
  if(!arr.length){ list.innerHTML='<div class="muted" style="padding:10px">Chưa có thẻ từ nào trong bài này. Bôi đen từ trong transcript → 🔖, hoặc bấm “＋ Thêm thẻ”.</div>'; return; }
  arr.forEach(v=>{ try{ list.appendChild(vcardEl(v)); }catch(e){ console.warn("renderVocab: bỏ qua 1 thẻ do lỗi, các thẻ khác vẫn hiện bình thường",e,v); } });
}
function vcardEl(v){
  const el=document.createElement('div'); el.className='vcard'; el.dataset.id=v.id;
  const wordSz=v.wordFontSize||32, usageSz=v.contentFontSize||15;
  const otherOccs=(v.occurrences||[]).filter(o=>o.itemId!==currentItemId).filter(o=>typeof occItemExists!=="function"||occItemExists(o));
  el.innerHTML=`<div class="vcard-head">
      <span class="w" style="font-size:${wordSz}px;${wordStyleCSS(v)};padding:1px 6px;border-radius:5px">${esc(v.word)}</span>
      <span class="py">${esc(v.pinyin||'')}</span>
      <button class="iconbtn x" style="width:28px;height:28px;font-size:12px" title="Sửa">✏️</button>
      <button class="iconbtn x" style="width:28px;height:28px;font-size:12px" title="Xoá">🗑</button>
    </div>
    <div class="vcard-body">
      ${VFIELDS.slice(1).map(([k,label])=> v[k]?`<div class="vfield"><label>${label.replace(/^[①-⑩]\s/,'')}</label><div class="val" style="font-size:${usageSz}px">${v[k]}</div></div>`:'').join('')}
      ${otherOccs.length?`<div class="occ-row" style="margin-top:8px;font-size:11.5px;color:var(--ink-soft)">📍 Cũng xuất hiện ở: ${otherOccs.map((o,i)=>`<button type="button" class="occ-btn" data-occi="${i}" style="border:1px solid var(--paper-3);background:var(--paper-2);border-radius:20px;padding:2px 9px;margin:2px 3px 0 0;font-size:11px;cursor:pointer;color:var(--green-deep)">${esc(o.app+' · '+o.itemTitle)}</button>`).join('')}</div>`:''}
    </div>`;
  const head=el.querySelector('.vcard-head');
  head.onclick=e=>{ if(e.target.closest('.iconbtn')||e.target.closest('.occ-btn'))return;
    el.classList.toggle('open');
    if(el.classList.contains('open')){
      // Nếu từ này CÓ xuất hiện trong bài đang mở, cuộn tới đúng câu và nháy sáng cho dễ nhận ra
      const hits=[...document.querySelectorAll('#transcriptEditor .vocab-hit,#translationEditor .vocab-hit')].filter(h=>h.dataset.word===v.word);
      if(hits.length){ hits[0].scrollIntoView({behavior:'smooth',block:'center'}); hits[0].classList.add('flash-hit'); setTimeout(()=>hits[0].classList.remove('flash-hit'),1500); }
    }
  };
  el.querySelectorAll('.occ-btn').forEach((btn,i)=>btn.onclick=(ev)=>{ev.stopPropagation();goToOccurrence(otherOccs[i],v.word);});
  const [editBtn,delBtn]=el.querySelectorAll('.iconbtn');
  editBtn.onclick=e=>{e.stopPropagation(); openVocabForm(v);};
  delBtn.onclick=e=>{e.stopPropagation(); if(confirm('Xoá thẻ “'+v.word+'” khỏi KHO TỪ VỰNG CHUNG? (ảnh hưởng tất cả app, không chỉ app này)')){
    state.vocab=state.vocab.filter(x=>x.id!==v.id); saveMeta(); renderVocab($('#vocabSearch').value);
    applyVocabHighlights($('#transcriptEditor')); applyVocabHighlights($('#translationEditor')); }};
  return el;
}

    renderVocab(); applyVocabHighlights($('#transcriptEditor')); applyVocabHighlights($('#translationEditor'));
    toast('Đã lưu thẻ.');
  };

}
function jumpToVocab(word){
  // 1) Nhảy tới ĐÚNG chỗ từ đó xuất hiện trong bài (transcript hoặc bản dịch) — tìm đúng
  // từ khớp trong khung đang hiển thị, cuộn tới và nháy sáng lên cho dễ nhận ra.
  const hits=[...document.querySelectorAll('#transcriptEditor .vocab-hit,#translationEditor .vocab-hit')]
    .filter(h=>h.dataset.word===word);
  if(hits.length){
    const hit=hits[0];
    hit.scrollIntoView({behavior:'smooth',block:'center'});
    hit.classList.add('flash-hit');
    setTimeout(()=>hit.classList.remove('flash-hit'),1500);
  }
  // 2) Đồng thời mở khung "Thẻ & ghi chú" bên phải, cuộn tới đúng thẻ từ đó để xem chi tiết
  openDrawer('right'); switchRTab('vocab');
  const v=state.vocab.find(x=>x.word===word); if(!v)return;
  renderVocab();
  setTimeout(()=>{ const el=$(`.vcard[data-id="${v.id}"]`); if(el){ el.classList.add('open','flash');
    el.scrollIntoView({behavior:'smooth',block:'center'}); setTimeout(()=>el.classList.remove('flash'),1200);} },60);
}

function deleteNote(id){

function htmlToText(h){ const d=document.createElement('div'); d.innerHTML=h||''; return d.textContent||''; }
const doSearch=debounce(q=>{
  const box=$('#searchResults'); q=q.trim().toLowerCase();
  if(!q){ box.classList.remove('open'); return; }
  const res=[];
  walk(state.roots,(n,parent)=>{
    if(n.type==='folder'){ if((n.name||'').toLowerCase().includes(q)) res.push({type:'Thư mục',id:n.id,label:n.name,path:pathOf(n.id).slice(0,-1).join(' › ')}); }
    else{
      const inTitle=(n.title||'').toLowerCase().includes(q);
      const inTrans=htmlToText(n.transcriptHtml).toLowerCase().includes(q)||htmlToText(n.translationHtml).toLowerCase().includes(q);
      const inQ=(n.questions||[]).some(x=>(x.text||'').toLowerCase().includes(q)||x.options.some(o=>(o||'').toLowerCase().includes(q)));
      if(inTitle||inTrans||inQ) res.push({type:'Bài',id:n.id,label:n.title,path:pathOf(n.id).slice(0,-1).join(' › '),
        sub: inTitle?'':(inTrans?'khớp transcript':'khớp câu hỏi')});
    }
  });
  state.vocab.forEach(v=>{ if((v.word||'').toLowerCase().includes(q)||htmlToText(v.content||'').toLowerCase().includes(q))
    res.push({type:'Từ vựng',vocab:true,id:v.id,label:v.word,path:htmlToText(v.content||'').slice(0,40)}); });

  box.innerHTML = res.length ? res.map(r=>`<div class="sr-item" data-id="${r.id}" data-v="${r.vocab?1:0}">
      <span class="tag ${r.vocab?'v':''}">${r.type}</span>${esc(r.label)}
      <div class="path">${esc(r.path||'')}${r.sub?' · '+r.sub:''}</div></div>`).join('')
    : '<div class="sr-empty">Không tìm thấy.</div>';
  box.classList.add('open');
  $$('.sr-item',box).forEach(it=>it.onclick=()=>{
    box.classList.remove('open'); $('#search').value='';
    if(it.dataset.v==='1'){ const v=state.vocab.find(x=>x.id===it.dataset.id);
      const occ=(v.occurrences||[]).find(o=>o.itemId&&findItem(o.itemId));
      if(occ) openItem(occ.itemId); jumpToVocab(v.word); }
    else{ const r=findNode(it.dataset.id); if(r.node.type==='item') openItem(r.node.id);
      else { expanded.add(r.node.id); openDrawer('left'); renderTree(); } }
  });
},180);

function blobToBase64(blob){
  return new Promise((res,rej)=>{ const r=new FileReader(); r.onload=()=>res(r.result); r.onerror=rej; r.readAsDataURL(blob); });
}
function base64ToBlob(dataUrl,mime){
  const arr=dataUrl.split(','); const bstr=atob(arr[1]); let n=bstr.length; const u8=new Uint8Array(n);
  while(n--) u8[n]=bstr.charCodeAt(n);
  return new Blob([u8],{type:mime||'audio/mpeg'});
}
async function exportJSON(){
  toast('Đang gom audio để xuất file… vui lòng đợi');
  const audioData={};
  const mediaKeys=[]; // {itemTitle, media}
  walk(state.roots,n=>{
    if(n.type!=='item') return;
    (n.mediaList||[]).forEach(m=>{ if(m&&m.mode==='file'&&m.key) mediaKeys.push({title:n.title,media:m}); });
    if(n.audio&&n.audio.mode==='file'&&n.audio.key) mediaKeys.push({title:n.title,media:n.audio});
  });
  for(const {title,media} of mediaKeys){
    try{ const blob=await idbGet('audio',media.key);
      if(blob){ const b64=await blobToBase64(blob); audioData[media.key]={data:b64,type:blob.type||'audio/mpeg'}; }
    }catch(e){ console.warn('Không đọc được audio cho',title,e); }
  }
  const appData=Object.assign({},state); delete appData.vocab; // tách kho chung ra riêng cho rõ ràng, đồng bộ với 3 app kia
  const payload={__hanBackup:true, app:'tinh-nghe', appData, vocabBank:(state.vocab||[]), audioData, exportedAt:new Date().toISOString()};
  const blob=new Blob([JSON.stringify(payload)],{type:'application/json'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob);
  a.download='tinh-nghe-backup-'+todayStr()+'.json'; a.click(); URL.revokeObjectURL(a.href);
  toast('Đã xuất file JSON (kèm '+mediaKeys.length+' audio/video + kho từ vựng chung).');
}
async function importJSON(e){
  const f=e.target.files[0]; if(!f)return;
  const r=new FileReader(); r.onload=async()=>{ try{ const raw=JSON.parse(r.result);
    const isWrapped = raw && raw.__hanBackup===true;
    const data = isWrapped ? raw.appData : raw;
    if(!data || !data.roots) throw 0;
    const audioData = isWrapped ? (raw.audioData||{}) : (data.audioData||{});
    if(!isWrapped) delete data.audioData;
    const incomingBank = isWrapped && Array.isArray(raw.vocabBank) ? raw.vocabBank : (Array.isArray(data.vocab)?data.vocab:null);
    if(!confirm('Nạp backup sẽ THAY THẾ toàn bộ dữ liệu app Nghe hiện tại (cây bài, transcript, câu hỏi…). Tiếp tục?')) return;
    state=data; if(!state.vocab)state.vocab=[];
    if(!state.settings)state.settings={hlColor:'var(--hl-yellow)',vocabColor:'#FFF1A8'};
    if(incomingBank){
      if(confirm(`File này có kèm kho từ vựng chung (${incomingBank.length} thẻ). Khôi phục kho chung này? (sẽ GHI ĐÈ kho hiện tại đang có ${(state.vocab||[]).length} thẻ)`)){
        state.vocab=incomingBank;
      }
    }
    let restored=0;
    for(const key of Object.keys(audioData)){
      try{ const b=base64ToBlob(audioData[key].data,audioData[key].type); await idbSet('audio',key,b); restored++; }
      catch(e2){ console.warn('Lỗi khôi phục audio',key,e2); }
    }
    currentItemId=null; renderTree(); renderVocab(); renderMain(); saveMeta(); closeModal();
    toast('Đã nhập dữ liệu'+(restored?' (kèm '+restored+' audio)':'')+'.');
  }catch(_){ toast('File JSON không hợp lệ.'); } };
  r.readAsText(f);
}
async function connectFile(){
  if(!FSA){ toast('Không hỗ trợ trên trình duyệt này.'); return; }
  try{
    fileHandle = await window.showSaveFilePicker({suggestedName:'tinh-nghe.json',
      types:[{description:'JSON',accept:{'application/json':['.json']}}]});
    await idbSet('meta','fileHandle',fileHandle);
    await writeHandle(); toast('Đã kết nối file. Sẽ tự ghi khi bạn sửa.'); closeModal();
  }catch(err){ if(err&&err.name!=='AbortError') toast('Không kết nối được file.'); }
}
async function writeHandle(){
  try{
    if(!fileHandle) return;
    if(fileHandle.queryPermission){ const p=await fileHandle.queryPermission({mode:'readwrite'});
      if(p!=='granted'){ const r=await fileHandle.requestPermission({mode:'readwrite'}); if(r!=='granted')return; } }
    const w=await fileHandle.createWritable(); await w.write(JSON.stringify(state,null,2)); await w.close();
  }catch(e){ console.warn('writeHandle lỗi',e); }
}

let _topbar2Wired=false;
function wireTopbar2Once(){
  if(_topbar2Wired) return; _topbar2Wired=true;
  const tb=$('#topbar2nd'); if(!tb) return;
  // font selector — chỉ áp cho CHỮ ĐANG BÔI ĐEN (giữ selection bằng mousedown, giống cách A-/A+ hoạt động)
  const fsel=$('#tb2Font');
  if(fsel){
    const fontMap={
      'kaiti':"'KaiTi','楷体',serif",
      'quicksand':"'Quicksand',sans-serif",
      'simsun':"'SimSun','宋体',serif",
      'yahei':"'YaHei','微软雅黑',sans-serif"
    };
    let savedFontRange=null;
    fsel.addEventListener('mousedown',()=>{ savedFontRange=getSelRange(); });
    fsel.onchange=()=>{
      const key=fsel.value;
      if(key && savedFontRange){
        const ed2=wrapRangeWithStyle(savedFontRange,'fontFamily',fontMap[key]||fontMap.kaiti,{keepSelection:true});
        if(!ed2) toast('Hãy bôi đen chữ cần đổi kiểu chữ trước.');
      } else if(key){ toast('Hãy bôi đen chữ cần đổi kiểu chữ trước.'); }
      fsel.selectedIndex=0; savedFontRange=null;
    };
  }
  // size buttons — chỉ đổi cỡ CHỮ ĐANG BÔI ĐEN (không đổi cả ô), giữ selection bằng mousedown+preventDefault
  const szDn=$('#tb2SzDn'), szUp=$('#tb2SzUp');
  function tweakSize(d){
    const range=getSelRange();
    if(!range){ toast('Hãy bôi đen chữ cần đổi cỡ trước.'); return; }
    const startEl=range.startContainer.nodeType===1?range.startContainer:range.startContainer.parentElement;
    const curSize=parseFloat(getComputedStyle(startEl).fontSize)||21;
    const newSize=Math.max(10,Math.min(72,Math.round(curSize+d*2)));
    wrapRangeWithStyle(range,'fontSize',newSize+'px');
  }
  if(szDn){ szDn.addEventListener('mousedown',e=>e.preventDefault()); szDn.onclick=()=>tweakSize(-1); }
  if(szUp){ szUp.addEventListener('mousedown',e=>e.preventDefault()); szUp.onclick=()=>tweakSize(1); }
  // hoàn tác / làm lại — dùng undo stack gốc của trình duyệt cho ô đang bôi đen/đang focus
  const undoBtn=$('#tb2Undo'), redoBtn=$('#tb2Redo');
  if(undoBtn){ undoBtn.addEventListener('mousedown',e=>e.preventDefault()); undoBtn.onclick=()=>{ document.execCommand('undo'); }; }
  if(redoBtn){ redoBtn.addEventListener('mousedown',e=>e.preventDefault()); redoBtn.onclick=()=>{ document.execCommand('redo'); }; }
  const tblBtn=$('#tb2Table');
  if(tblBtn){
    tblBtn.addEventListener('mousedown',e=>e.preventDefault());
    tblBtn.addEventListener('click',()=>{
      const ed=document.activeElement&&document.activeElement.isContentEditable?document.activeElement:$('#transcriptEditor');
      if(!ed){ toast('Hãy bấm vào ô transcript/dịch trước.'); return; }
      // Chụp lại vị trí con trỏ TRƯỚC khi mở hộp thoại hỏi số hàng/cột — prompt() có thể
      // làm mất vị trí con trỏ đang có, chụp trước để chèn bảng đúng chỗ dù có mất đi nữa.
      let preRange=null;
      const sel=window.getSelection();
      if(sel&&sel.rangeCount&&ed.contains(sel.getRangeAt(0).commonAncestorContainer)) preRange=sel.getRangeAt(0).cloneRange();
      const rows=parseInt(prompt('Số hàng?','3'))||3;
      const cols=parseInt(prompt('Số cột?','3'))||3;
      insertTableAt(ed,Math.max(1,Math.min(30,rows)),Math.max(1,Math.min(15,cols)),preRange);
    });
  }
  const paintBtn2=$('#tb2Paint');
  if(paintBtn2){ paintBtn2.addEventListener('mousedown',e=>e.preventDefault()); paintBtn2.addEventListener('click',()=>togglePaintMode([paintBtn2])); }
  const histBtn2=$('#tb2Hist');
  if(histBtn2){
    histBtn2.addEventListener('mousedown',e=>e.preventDefault());
    histBtn2.addEventListener('click',()=>{
      const it=findItem(currentItemId); if(!it){ toast('Hãy mở 1 bài trước.'); return; }
      historyPanel(it.id, (data)=>{ Object.assign(it,data); saveMeta(); renderMain(); toast('Đã khôi phục.'); }, ()=>({...it}));
    });
  }
  const exportPrettyBtn2=$('#tb2ExportPretty');
  if(exportPrettyBtn2){
    exportPrettyBtn2.addEventListener('mousedown',e=>e.preventDefault());
    exportPrettyBtn2.addEventListener('click',()=>{
      const it=findItem(currentItemId); if(!it){ toast('Hãy mở 1 bài trước.'); return; }
      openPassagePrettyView(it);
    });
  }
  // #bulkToolbar (chọn cả cột/hàng) tự khởi tạo và tự gắn nút trong shared-tables.js, không cần làm gì thêm ở đây
  // Nút định dạng — mousedown+preventDefault giữ selection, execCommand áp dụng ngay tại chỗ bôi đen
  const fmtCmds=[['tb2Bold','bold'],['tb2Italic','italic'],['tb2Und','underline'],['tb2Strike','strikeThrough'],
    ['tb2Bullet','insertUnorderedList'],['tb2Num','insertOrderedList'],
    ['tb2AlignL','justifyLeft'],['tb2AlignC','justifyCenter'],['tb2AlignR','justifyRight'],['tb2AlignJ','justifyFull'],
    ['tb2Outdent','outdent'],['tb2Indent','indent'],['tb2Sup','superscript'],['tb2Sub','subscript'],['tb2Clear','removeFormat']];
  fmtCmds.forEach(([id,cmd])=>{
    const b=$('#'+id); if(!b) return;
    b.addEventListener('mousedown',e=>{
      e.preventDefault(); // giữ selection/focus của editor đang active
      document.execCommand('styleWithCSS',false,false);
      document.execCommand(cmd);
      // Fire input trên element đang được edit (bất kỳ contenteditable nào)
      const fc=document.activeElement;
      if(fc&&fc.isContentEditable) fc.dispatchEvent(new Event('input',{bubbles:true}));
    });
  });
  // Giãn dòng — áp dụng trên element đang focus
  function tweakActiveLh(d){
    const ed=document.activeElement; if(!ed||!ed.isContentEditable) return;
    const lh=Math.max(1,Math.min(4,+(parseFloat(ed.dataset.lh||2)+d).toFixed(1)));
    ed.style.lineHeight=lh; ed.dataset.lh=lh;
    const it=findItem(currentItemId); if(!it) return;
    if(ed.id==='transcriptEditor') it.tlh=lh;
    else if(ed.id==='translationEditor') it.trLh=lh;
    saveMeta();
  }
  $('#tb2LhDn')?.addEventListener('mousedown',e=>{e.preventDefault();tweakActiveLh(-0.2);});
  $('#tb2LhUp')?.addEventListener('mousedown',e=>{e.preventDefault();tweakActiveLh(0.2);});
  // Màu nền / màu chữ
  $('#tb2HlBtn')?.addEventListener('mousedown',e=>{e.preventDefault();openColorPop('hl',e.currentTarget);});
  $('#tb2HlOpen')?.addEventListener('mousedown',e=>{e.preventDefault();openColorPop('hl',e.currentTarget);});
  $('#tb2FcBtn')?.addEventListener('mousedown',e=>{e.preventDefault();openColorPop('fc',e.currentTarget);});
  $('#tb2FcOpen')?.addEventListener('mousedown',e=>{e.preventDefault();openColorPop('fc',e.currentTarget);});
  // Toggle ẩn/hiện
  $('#tb2TgTrans')?.addEventListener('mousedown',e=>{e.preventDefault();$('#tgTrans')?.click();});
  $('#tb2TgTransl')?.addEventListener('mousedown',e=>{e.preventDefault();$('#tgTransl')?.click();});
  $('#tb2TgAll')?.addEventListener('mousedown',e=>{e.preventDefault();$('#tgAll')?.click();});
}

  wireTopbar2Once(); // chỉ thực sự gắn sự kiện ở lần gọi đầu tiên, các lần sau không làm gì
  tb.classList.add('show');

  // nav arrows
  const flat=flatItems(); const i=flat.indexOf(item.id);

  if(prev){prev.disabled=!(i>0); prev.onclick=()=>navToItem(-1);}

  // pip title
  const pt=$('#pipTitle'); if(pt) pt.textContent=item.title||'Video';
}

/* ============================================================
   🎞️ VIDEO RESIZE (kéo để to/nhỏ)
   ============================================================ */
function wireVideoResize(){
  const handle=$('#ytResizeHandle'), wrap=$('#ytWrap');
  if(!handle||!wrap) return;
  function initDrag(startY, startH){
    function onMove(e){
      const clientY=e.touches?e.touches[0].clientY:e.clientY;
      const newH=Math.max(140,Math.min(700,startH+(clientY-startY)));
      wrap.style.paddingTop='0'; wrap.style.height=newH+'px';
    }
    function onEnd(){ document.removeEventListener('mousemove',onMove); document.removeEventListener('mouseup',onEnd);
      document.removeEventListener('touchmove',onMove); document.removeEventListener('touchend',onEnd); }
    document.addEventListener('mousemove',onMove);
    document.addEventListener('mouseup',onEnd);
    document.addEventListener('touchmove',onMove,{passive:true});
    document.addEventListener('touchend',onEnd);
  }
  handle.addEventListener('mousedown',e=>{ e.preventDefault();
    const h=wrap.getBoundingClientRect().height; initDrag(e.clientY,h); });
  handle.addEventListener('touchstart',e=>{ const t=e.touches[0];
    const h=wrap.getBoundingClientRect().height; initDrag(t.clientY,h); },{passive:true});
}

   ============================================================ */
function wireStudioDivider(handle, leftCol, rightCol){
  function startDrag(startX){
    handle.classList.add('dragging');
    const wrap=leftCol.parentElement;
    const totalW=wrap.offsetWidth - handle.offsetWidth;
    const startLeftW=leftCol.offsetWidth;
    function onMove(e){
      const dx=(e.touches?e.touches[0].clientX:e.clientX)-startX;
      const newW=Math.max(200,Math.min(totalW-200,startLeftW+dx));
      leftCol.style.width=newW+'px';
      leftCol.style.flex='none';
    }
    function onEnd(){
      handle.classList.remove('dragging');
      document.removeEventListener('mousemove',onMove);
      document.removeEventListener('mouseup',onEnd);
      document.removeEventListener('touchmove',onMove);
      document.removeEventListener('touchend',onEnd);
      updateSplitHeight(); // cập nhật split height sau resize
    }
    document.addEventListener('mousemove',onMove);
    document.addEventListener('mouseup',onEnd);
    document.addEventListener('touchmove',onMove,{passive:true});
    document.addEventListener('touchend',onEnd);
  }
  handle.addEventListener('mousedown',e=>{e.preventDefault();startDrag(e.clientX);});
  handle.addEventListener('touchstart',e=>startDrag(e.touches[0].clientX),{passive:true});
}

function updateSplitHeight(){
  const pane=$('#splitPane'); if(!pane) return;
  // Non-studio: để height tự nhiên, không ép cố định
  if(!document.body.classList.contains('studio-mode')){
    pane.style.height=''; pane.style.minHeight='200px'; return;
  }
  // Studio: fill phần còn lại sau card-head
  const splitCard=document.getElementById('splitCard');
  const topH=document.body.classList.contains('has-tb2')?106:60;
  const headH=(splitCard?.querySelector('.card-head')?.offsetHeight||52);
  pane.style.height=Math.max(180,window.innerHeight-topH-headH-4)+'px';
}
window.addEventListener('resize',updateSplitHeight,{passive:true});

function wireSplitDrag(){
  const handle=$('#splitDrag');
  const transCol=$('#transCol');
  const translCol=$('#translCol');
  if(!handle||!transCol||!translCol) return;
  function startDrag(startX){
    handle.classList.add('dragging');
    const paneW=(transCol.parentElement?.offsetWidth||800)-handle.offsetWidth;
    const startW=transCol.offsetWidth;
    function onMove(e){
      const dx=(e.touches?e.touches[0].clientX:e.clientX)-startX;
      const newW=Math.max(80,Math.min(paneW-80,startW+dx));
      transCol.style.flex=`0 0 ${(newW/paneW*100).toFixed(1)}%`;
      translCol.style.flex='1 1 0';
    }
    function onEnd(){ handle.classList.remove('dragging');
      document.removeEventListener('mousemove',onMove);
      document.removeEventListener('mouseup',onEnd);
      document.removeEventListener('touchmove',onMove);
      document.removeEventListener('touchend',onEnd);
    }
    document.addEventListener('mousemove',onMove);
    document.addEventListener('mouseup',onEnd);
    document.addEventListener('touchmove',onMove,{passive:true});
    document.addEventListener('touchend',onEnd);
  }
  handle.addEventListener('mousedown',e=>{ e.preventDefault(); startDrag(e.clientX); });
  handle.addEventListener('touchstart',e=>startDrag(e.touches[0].clientX),{passive:true});
}

function copyItemContentDialog(srcItem){
  // Thu thập tất cả item khác (không phải bài đang mở)
  const targets=[];
  walk(state.roots,n=>{ if(n.type==='item'&&n.id!==srcItem.id) targets.push(n); });
  if(!targets.length){ toast('Không có bài nào khác để chép sang.'); return; }

  const opts=targets.map(n=>`<option value="${esc(n.id)}">${esc(n.title||'Bài chưa đặt tên')}</option>`).join('');
  const m=document.createElement('div'); m.className='modal-backdrop';
  m.innerHTML=`<div class="modal" style="max-width:440px">
    <div class="modal-head"><h3>📋 Chép sang bài khác</h3><button class="modal-close" id="copyClose">✕</button></div>
    <div class="modal-body" style="padding:18px">
      <p style="font-size:13px;color:var(--ink-soft);margin-bottom:12px">Chọn bài đích — transcript, bản dịch, thẻ từ và ghi chú sẽ được SAO CHÉP (không xoá bài gốc):</p>
      <select id="copyTarget" style="width:100%;padding:8px 10px;border:1px solid var(--paper-3);border-radius:10px;font-size:13px;background:var(--paper);color:var(--ink);margin-bottom:14px">${opts}</select>
      <label style="display:flex;align-items:center;gap:8px;font-size:13px;margin-bottom:8px">
        <input type="checkbox" id="copyTrans" checked> Transcript &amp; Bản dịch
      </label>
      <label style="display:flex;align-items:center;gap:8px;font-size:13px;margin-bottom:8px">
        <input type="checkbox" id="copyVocab" checked> Thẻ từ vựng (${srcItem.vocab?.length||0} thẻ)
      </label>
      <label style="display:flex;align-items:center;gap:8px;font-size:13px;margin-bottom:18px">
        <input type="checkbox" id="copyNotes" checked> Ghi chú (${srcItem.notes?.length||0} ghi chú)
      </label>
      <div style="display:flex;gap:8px;justify-content:flex-end">
        <button class="pill" id="copyCancel">Huỷ</button>
        <button class="pill on" id="copyConfirm">📋 Chép ngay</button>
      </div>
    </div>
  </div>`;
  document.body.appendChild(m);
  m.querySelector('#copyClose').onclick=m.querySelector('#copyCancel').onclick=()=>m.remove();
  m.querySelector('#copyConfirm').onclick=()=>{
    const tid=m.querySelector('#copyTarget').value;
    const dest=targets.find(n=>n.id===tid); if(!dest){ m.remove(); return; }
    if(m.querySelector('#copyTrans').checked){
      dest.transcriptHtml=srcItem.transcriptHtml||'';
      dest.translationHtml=srcItem.translationHtml||'';
    }
    if(m.querySelector('#copyVocab').checked){
      // Merge vocab (tránh trùng lặp theo từ)
      const existing=new Set((dest.vocab||[]).map(v=>v.word));
      const toAdd=(srcItem.vocab||[]).filter(v=>!existing.has(v.word));
      dest.vocab=[...(dest.vocab||[]),...toAdd];
    }
    if(m.querySelector('#copyNotes').checked){
      dest.notes=[...(dest.notes||[]),...(srcItem.notes||[]).map(n=>({...n,id:uid()}))];
    }
    saveMeta(); m.remove();
    toast(`✅ Đã chép sang "${dest.title||'Bài chưa đặt tên'}"`);
  };
}

/* ============================================================
   拼音  Pinyin trên từng chữ (pinyin-pro, load động khi cần)
   ============================================================ */
function loadPinyinPro(cb){
  if(typeof pinyinPro!=='undefined'){cb();return;}
  const s=document.createElement('script');
  s.src='https://unpkg.com/pinyin-pro@3.24.2/dist/index.js';
  s.onload=cb;
  s.onerror=()=>toast('❌ Không tải được thư viện pinyin — kiểm tra kết nối mạng rồi thử lại.');
  document.head.appendChild(s);
}
function annotatePinyin(root){
  if(typeof pinyinPro==='undefined'||!root) return;
  const {pinyin}=pinyinPro;
  const walker=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,{acceptNode(n){
    if(!n.nodeValue||!/[\u4e00-\u9fff]/.test(n.nodeValue)) return NodeFilter.FILTER_SKIP;
    const p=n.parentElement;
    return(p&&p.closest&&p.closest('script,style,rt'))?NodeFilter.FILTER_REJECT:NodeFilter.FILTER_ACCEPT;
  }});
  const nodes=[];let n;while(n=walker.nextNode())nodes.push(n);
  nodes.forEach(node=>{
    try{
      const text=node.nodeValue;
      const pyArr=pinyin(text,{type:'array',toneType:'symbol'});
      const frag=document.createDocumentFragment();
      let ci=0;
      for(let i=0;i<text.length;i++){
        const ch=text[i];
        if(/[\u4e00-\u9fff]/.test(ch)){
          const py=pyArr[ci++]||'';
          const wrap=document.createElement('span'); wrap.className='py-result-item';
          const ruby=document.createElement('ruby');
          const cspan=document.createElement('span'); cspan.className='py-chinese-item'; cspan.textContent=ch;
          const rt=document.createElement('rt'); rt.className='py-pinyin-item'; rt.textContent=py;
          ruby.appendChild(cspan); ruby.appendChild(rt); wrap.appendChild(ruby); frag.appendChild(wrap);
        }else{frag.appendChild(document.createTextNode(ch));ci++;}
      }
      node.parentNode.replaceChild(frag,node);
    }catch(e){}
  });
}
function stripPinyinHTML(html){
  if(!html||html.indexOf('py-result-item')<0) return html;
  const tmp=document.createElement('div'); tmp.innerHTML=html;
  tmp.querySelectorAll('.py-result-item').forEach(item=>{
    const ch=item.querySelector('.py-chinese-item');
    item.replaceWith(document.createTextNode(ch?ch.textContent:item.textContent));
  });
  return tmp.innerHTML;
}
function applyPinyinBtn(){
  const on=!!state.settings.pinyin;
  const b=document.getElementById('pinyinToggle'); if(!b) return;
  b.classList.toggle('on',on);
  b.title=on?'Đang hiện pinyin — bấm để ẩn':'Bấm để hiện pinyin trên từng chữ Hán trong transcript';
  // Tăng line-height cho transcriptEditor khi bật pinyin
  const te=document.getElementById('transcriptEditor'); if(!te) return;
  te.classList.toggle('pinyon-on',on);

document.getElementById('pinyinToggle').onclick=()=>{

};

/* ============================================================
   简 ⇄ 繁  Giản thể ⇄ Phồn thể (opencc-js)
   ============================================================ */
let occS2T=null, occT2S=null;
function occReady(){
  if(typeof OpenCC==='undefined') return false;
  if(!occS2T){ occS2T=OpenCC.Converter({from:'cn',to:'tw'}); occT2S=OpenCC.Converter({from:'tw',to:'cn'}); }
  return true;
}
function occConv(){ return occReady()?(state.settings.script==='tw'?occS2T:occT2S):null; }

const scriptObserver=new MutationObserver(muts=>{
  if(state.settings.script!=='tw') return;
  const roots=new Set();
  muts.forEach(m=>{
    if(m.type==='characterData') roots.add(m.target);
    else if(m.type==='childList') m.addedNodes.forEach(nd=>{if(nd.nodeType===1||nd.nodeType===3)roots.add(nd);});
  });
  roots.forEach(r=>{ if(document.body.contains(r)) convertTextIn(r); });
});

function convertTextIn(root){
  const conv=occConv(); if(!conv||!root) return;
  scriptObserver.disconnect();
  try{
    if(root.nodeType===3){
      const v=conv(root.nodeValue); if(v!==root.nodeValue) root.nodeValue=v;
    } else if(root.nodeType===1){
      const walker=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,{acceptNode(n){
        const p=n.parentElement;
        return(p&&p.closest&&p.closest('script,style'))?NodeFilter.FILTER_REJECT:NodeFilter.FILTER_ACCEPT;
      }});
      const nodes=[]; let n; while(n=walker.nextNode()) nodes.push(n);
      nodes.forEach(node=>{ try{ const v=conv(node.nodeValue); if(v!==node.nodeValue) node.nodeValue=v; }catch(e){} });
    }
  }catch(e){}
  scriptObserver.observe(document.body,{childList:true,subtree:true,characterData:true});
}

function applyScriptBtn(){
  const tw=state.settings.script==='tw';
  const b=document.getElementById('scriptToggle'); if(!b) return;
  b.classList.toggle('on',tw);
  b.textContent=tw?'繁 → 简':'简 → 繁';
  b.title=tw?'Đang hiển thị Phồn thể — bấm để chuyển về Giản thể':'Đang hiển thị Giản thể — bấm để chuyển sang Phồn thể';
}

document.getElementById('scriptToggle').onclick=()=>{
  if(!occReady()){
    toast('Bộ chuyển đổi chữ Hán chưa tải xong — kiểm tra kết nối mạng rồi thử lại.');
    return;
  }
  state.settings.script = state.settings.script==='tw' ? 'cn' : 'tw';
  convertTextIn(document.body);
  applyScriptBtn();
  saveMeta();
};

/* ============================================================
   ↔ VOCAB PANEL RESIZE — kéo cạnh trái để rộng/hẹp
   ============================================================ */
function wireVocabResize(){
  const drawer=document.getElementById('drawerRight'); if(!drawer) return;
  // Thêm handle nếu chưa có
  if(document.getElementById('vocabResizeHandle')) return;
  const handle=document.createElement('div');
  handle.id='vocabResizeHandle'; handle.title='Kéo để điều chỉnh chiều rộng';
  drawer.insertBefore(handle,drawer.firstChild);

  handle.addEventListener('mousedown',e=>{
    e.preventDefault(); e.stopPropagation();
    handle.classList.add('dragging');
    const startX=e.clientX;
    const startW=drawer.offsetWidth;
    function onMove(e){
      const dx=startX-e.clientX; // kéo trái = rộng hơn
      const newW=Math.max(220,Math.min(Math.round(window.innerWidth*0.55),startW+dx));
      document.documentElement.style.setProperty('--vocab-w',newW+'px');
    }
    function onEnd(){
      handle.classList.remove('dragging');
      document.removeEventListener('mousemove',onMove);
      document.removeEventListener('mouseup',onEnd);
    }
    document.addEventListener('mousemove',onMove);
    document.addEventListener('mouseup',onEnd);
  });
}

async function init(){
  await openDB();
  await loadMeta();
  wireFmtbar();                 // thanh định dạng dùng chung (1 lần)
  // Giản/Phồn: áp dụng trạng thái đã lưu
  if(!state.settings.script) state.settings.script='cn';
  applyScriptBtn();
  if(state.settings.script==='tw') convertTextIn(document.body);
  scriptObserver.observe(document.body,{childList:true,subtree:true,characterData:true});
  applyPinyinBtn();
  if(state.settings.pinyin) loadPinyinPro(()=>{
    const te=document.getElementById('transcriptEditor'); if(te) annotatePinyin(te);
  });
  renderTree(); renderVocab(); renderMain();

  $('#btnLeft').onclick =()=>openDrawer('left');
  $('#btnRight').onclick=()=>{ openDrawer('right'); renderVocab($('#vocabSearch').value); renderNotes(); };
  $('#closeLeft').onclick =()=>closeDrawer('left');
  $('#closeRight').onclick=()=>closeDrawer('right');
  $('#scrimLeft').onclick =()=>closeDrawer('left');
  $('#scrimRight').onclick=()=>closeDrawer('right');
  $('#btnSettings').onclick=openSettings;

  // tab Thẻ từ / Ghi chú trong ngăn phải
  $$('.rtabs .pill').forEach(b=>b.onclick=()=>{ switchRTab(b.dataset.rtab);
    if(b.dataset.rtab==='notes') renderNotes(); else renderVocab($('#vocabSearch').value); });

  $('#addRoot').onclick=()=>openPrompt('Tên thư mục gốc mới','',v=>{ if(!v.trim())return;
    state.roots.push({id:uid(),type:'folder',name:v.trim(),children:[]}); renderTree(); saveMeta(); });
  $('#expandAll').onclick=()=>{ walk(state.roots,n=>{if(n.type==='folder')expanded.add(n.id);}); renderTree(); };
  $('#collapseAll').onclick=()=>{ expanded.clear(); renderTree(); };

  $('#addVocabBtn').onclick=()=>openVocabForm({});
  $('#vocabSearch').addEventListener('input',e=>renderVocab(e.target.value));

  $('#search').addEventListener('input',e=>doSearch(e.target.value));
  $('#search').addEventListener('focus',e=>{ if(e.target.value)doSearch(e.target.value); });
  document.addEventListener('click',e=>{ if(!e.target.closest('.search-wrap')) $('#searchResults').classList.remove('open'); });

  // Esc đóng mọi thứ
  document.addEventListener('keydown',e=>{ if(e.key==='Escape'){ closeDrawer('left'); closeDrawer('right');
    closeModal(); $('#searchResults').classList.remove('open'); $('#selpop').classList.remove('show'); hideFmtbar(); } });

  // mở sẵn các thư mục gốc cho dễ nhìn
  state.roots.forEach(r=>expanded.add(r.id)); renderTree();
  wireVocabResize();

  /* ---- Bước 2a: mở đúng bài (và đúng từ) khi được điều hướng từ app khác qua URL ---- */
  try{
    const qp=new URLSearchParams(location.search);
    const openId=qp.get('open'), word=qp.get('word');
    if(openId && findItem(openId)){
      openItem(openId);
      if(word) setTimeout(()=>jumpToVocab(word),80);
      history.replaceState(null,'',location.pathname+location.hash);
    }
  }catch(e){}
  renderNavBackPill();
}
init();
</script>
</body>

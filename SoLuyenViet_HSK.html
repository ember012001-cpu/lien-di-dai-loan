    --font:'Quicksand',"Segoe UI","Helvetica Neue",Arial,"PingFang SC","Microsoft YaHei","Noto Sans SC",sans-serif;
    --zh-serif:'Quicksand',"Songti SC","STSong","SimSun","Noto Serif SC",serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{
    font-family:var(--font); color:var(--ink); background:var(--paper);
    font-size:15.5px; line-height:1.6; -webkit-font-smoothing:antialiased;
  }
  button{font-family:inherit;cursor:pointer}
  input,textarea,select{font-family:inherit;font-size:14.5px;color:var(--ink)}
  ::selection{background:#FFF0A6}

  /* ---------- Header ---------- */
  header{
    display:flex;align-items:center;gap:14px;
    padding:12px 20px; background:var(--green-deep); color:#F4F2E9;
    background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
    background-size:26px 26px; border-bottom:3px solid var(--green);
    position:sticky;top:0;z-index:30;
  }
  .brand{display:flex;align-items:baseline;gap:10px;font-weight:700}
  .brand .zh{font-family:var(--zh-serif);font-size:22px;letter-spacing:2px}
  .brand .vi{font-size:13px;font-weight:600;color:#BFD6CE;letter-spacing:.3px}
  header .search{margin-left:auto;position:relative}
  header .search input{
    width:240px;padding:8px 12px 8px 32px;border-radius:20px;border:none;
    background:rgba(255,255,255,.92);
  }
  header .search::before{content:"🔍";position:absolute;left:11px;top:7px;font-size:13px;opacity:.6}
  .hbtn{
    border:1px solid rgba(255,255,255,.35);background:rgba(255,255,255,.08);color:#F4F2E9;
    padding:8px 13px;border-radius:9px;font-weight:600;font-size:13.5px;transition:.15s;
  }
  .hbtn:hover{background:rgba(255,255,255,.2)}
  .hbtn.primary{background:#F4F2E9;color:var(--green-deep);border-color:#F4F2E9}
  .hbtn.primary:hover{background:#fff}
  .hbtn.on{background:#F4F2E9;color:var(--green-deep);border-color:#F4F2E9}
  /* --- Pinyin ruby --- */
  ruby{ruby-position:over;ruby-align:center}
  rt.py-pinyin-item{font-family:var(--font);font-size:.42em;font-weight:600;color:var(--green);user-select:none;letter-spacing:0}
  .py-result-item{display:inline}

  /* ---------- Layout ---------- */
  .wrap{display:flex;height:calc(100vh - 64px)}
  aside{
    position:fixed;left:0;top:64px;bottom:0;width:272px;z-index:40;
    background:var(--panel);border-right:1px solid var(--line);
    overflow-y:auto;padding:14px 10px;
    transform:translateX(-100%);transition:transform .22s ease;
  }
  aside.open{transform:none;box-shadow:8px 0 34px rgba(40,38,32,.18)}
  .nav-backdrop{position:fixed;inset:64px 0 0 0;background:rgba(30,28,24,.18);z-index:39;opacity:0;pointer-events:none;transition:.2s}
  .nav-backdrop.open{opacity:1;pointer-events:auto}
  main{flex:1;overflow-y:auto;padding:22px 26px}

  .nav-item{
    display:flex;align-items:center;gap:8px;padding:9px 11px;border-radius:9px;
    font-weight:600;font-size:14px;color:var(--ink);user-select:none;
  }
  .nav-item:hover{background:#EDEADD}
  .nav-item.active{background:var(--green);color:#fff}
  .nav-item .count{margin-left:auto;font-size:12px;font-weight:700;opacity:.7}
  .nav-item.active .count{opacity:.9}
  .nav-item.due{color:var(--red)}
  .nav-item.due.active{background:var(--red);color:#fff}
  .nav-sec{margin-top:16px;padding:6px 11px 4px;font-size:11.5px;font-weight:700;letter-spacing:1px;
    text-transform:uppercase;color:var(--ink-soft)}
  .nav-sec .zh{font-family:var(--zh-serif);letter-spacing:1px;text-transform:none;font-size:13px}
  .sub-item{
    display:flex;align-items:center;gap:7px;padding:7px 11px 7px 26px;border-radius:8px;
    font-size:13.5px;color:var(--ink-soft);
  }
  .sub-item:hover{background:#EDEADD;color:var(--ink)}
  .sub-item.active{background:var(--green-tint);color:var(--green-deep);font-weight:700}
  .sub-item .count{margin-left:auto;font-size:11px;opacity:.7}
  .sub-empty{padding:6px 11px 6px 26px;font-size:12.5px;color:var(--ink-faint);font-style:italic}

  /* ---------- List view ---------- */
  .list-head{display:flex;align-items:center;margin-bottom:18px}
  .list-head h2{margin:0;font-size:20px}
  .list-head .zh{font-family:var(--zh-serif);font-weight:400;color:var(--ink-soft);margin-left:8px;font-size:16px}
  .cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
  .card{
    background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    padding:16px 17px;box-shadow:var(--shadow);cursor:pointer;transition:.15s;position:relative;overflow:hidden;
  }
  .card:hover{transform:translateY(-2px);box-shadow:0 4px 10px rgba(40,38,32,.08),0 14px 30px rgba(40,38,32,.09)}
  .card .tag{
    display:inline-block;font-size:11px;font-weight:700;padding:3px 9px;border-radius:20px;
    background:var(--green-tint);color:var(--green-deep);margin-bottom:9px;
  }
  .card .tag.d2{background:#EFE7F4;color:#6A4A86}
  .card .tag.sub{background:#F0EEE3;color:var(--ink-soft);margin-left:6px}
  .card h3{margin:2px 0 4px;font-size:16px;font-family:var(--zh-serif);line-height:1.4}
  .card .prompt{font-size:13px;color:var(--ink-soft);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:34px}
  .card .meta{display:flex;align-items:center;gap:10px;margin-top:12px;font-size:12px;color:var(--ink-faint)}
  .seals{display:flex;gap:3px;margin-left:auto}
  .seal{width:19px;height:19px;border-radius:5px;border:1.5px solid var(--line);display:grid;place-items:center;
    font-family:var(--zh-serif);font-size:10px;color:var(--line);font-weight:700}
  .seal.done{border-color:var(--red);color:var(--red);background:var(--red-tint)}
  .card.due-card{border-color:var(--red)}
  .card .due-flag{position:absolute;top:0;right:0;background:var(--red);color:#fff;font-size:10.5px;font-weight:700;
    padding:3px 10px;border-bottom-left-radius:10px}
  .card-del{position:absolute;top:8px;right:8px;border:none;background:rgba(255,255,255,.85);border-radius:7px;
    width:28px;height:28px;font-size:14px;cursor:pointer;opacity:0;transition:.15s;z-index:2}
  .card:hover .card-del{opacity:1}
  .card-del:hover{background:var(--red-tint)}
  .tag.duepill{background:var(--red);color:#fff;margin-left:6px}
  .empty{color:var(--ink-soft);text-align:center;padding:60px 20px;font-size:15px}
  .empty button{margin-top:14px}

  /* ---------- Editor ---------- */
  .editor{max-width:1180px;margin:0 auto}
  .ed-top{display:flex;align-items:center;gap:10px;margin-bottom:16px}
  .back{background:none;border:1px solid var(--line);border-radius:9px;padding:8px 13px;font-weight:600;color:var(--ink-soft)}
  .back:hover{background:var(--panel)}
  .ed-actions{margin-left:auto;display:flex;gap:8px}
  .btn{border:none;border-radius:9px;padding:9px 16px;font-weight:700;font-size:14px;transition:.15s}
  .btn.save{background:var(--green);color:#fff}
  .btn.save:hover{background:var(--green-deep)}
  .btn.del{background:var(--red-tint);color:var(--red)}
  .btn.del:hover{background:#f6d8d3}
  .saved-tag{font-size:12.5px;color:var(--green);font-weight:600;opacity:0;transition:.3s}
  .saved-tag.show{opacity:1}

  .meta-grid{
    background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    padding:16px 18px;margin-bottom:18px;box-shadow:var(--shadow);
    display:grid;grid-template-columns:1fr 1fr;gap:12px 18px;
  }
  .fld{display:flex;flex-direction:column;gap:4px}
  .fld.full{grid-column:1/-1}
  .fld label{font-size:12px;font-weight:700;color:var(--ink-soft);letter-spacing:.3px}
  .fld input,.fld select,.fld textarea{
    border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:#FCFBF7;width:100%;
  }
  .fld input:focus,.fld select:focus,.fld textarea:focus,[contenteditable]:focus{
    outline:2px solid var(--green-tint);border-color:var(--green)
  }
  .fld textarea{resize:vertical;min-height:46px}

  .review-box{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    padding:12px 16px;margin:22px 0 8px;box-shadow:var(--shadow)}
  .review-box .rh{display:flex;align-items:center;gap:8px;margin-bottom:10px;font-size:13px}
  .review-box .rh .zh{font-family:var(--zh-serif);color:var(--ink-soft)}
  .mini{font-size:12px;border:1px dashed var(--green);color:var(--green-deep);background:var(--green-tint);
    border-radius:7px;padding:5px 10px;font-weight:600;margin-left:auto}
  .mini:hover{background:#d7e8e1}
  .review-dots{display:flex;gap:6px;flex-wrap:wrap;align-items:flex-start}
  .rdot{display:flex;flex-direction:column;align-items:center;gap:3px;width:44px}
  .rdot .ball{width:34px;height:34px;border-radius:50%;border:1.5px solid var(--line);background:var(--panel);
    color:var(--ink-soft);font-weight:700;font-size:12px;cursor:pointer;text-align:center;padding:0;font-family:inherit}
  .rdot.done .ball{background:var(--red);border-color:var(--red);color:#fff}
  .rdot .ball-custom{border-style:dashed}
  .rdot .dt{font-size:9px;border:1px solid var(--line);border-radius:5px;padding:1px;width:100%;text-align:center;background:#FCFBF7}

  /* rich sections */
  .section{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    margin-bottom:14px;box-shadow:var(--shadow);overflow:hidden}
  .section>summary{list-style:none;cursor:pointer;padding:13px 18px;display:flex;align-items:center;gap:10px;
    font-weight:700;font-size:14.5px;background:var(--panel)}
  .section>summary::-webkit-details-marker{display:none}
  .section>summary .num{font-family:var(--zh-serif);background:var(--green);color:#fff;width:24px;height:24px;
    border-radius:6px;display:grid;place-items:center;font-size:13px}
  .section>summary .zh{color:var(--ink-soft);font-weight:400;font-family:var(--zh-serif)}
  .section>summary .chev{margin-left:auto;color:var(--ink-faint);transition:.2s}
  .section[open]>summary .chev{transform:rotate(90deg)}
  .editable{padding:14px 18px;min-height:70px;outline:none;line-height:1.75}
  .editable:empty:before{content:attr(data-ph);color:var(--ink-faint);font-style:italic}
  .editable.essay{
    background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
    background-size:28px 28px;background-position:18px 14px;
  }
  .editable.zh{font-family:var(--zh-serif);font-size:16px}

  /* toolbar */
  .toolbar{position:sticky;top:0;z-index:20;display:flex;flex-wrap:wrap;align-items:center;gap:4px;
    background:var(--card);border:1px solid var(--line);border-radius:10px;padding:6px 8px;margin-bottom:16px;box-shadow:var(--shadow)}
  .toolbar button{border:1px solid var(--line);background:var(--panel);border-radius:8px;min-width:28px;height:28px;padding:0 6px;font-size:12.5px;font-weight:700;color:var(--ink);cursor:pointer;display:inline-flex;align-items:center;justify-content:center}
  .toolbar button:hover{background:var(--green-tint);border-color:var(--green)}
  .albar{display:inline-flex;flex-direction:column;gap:2px;width:15px;vertical-align:middle}
  .albar i{display:block;height:2px;background:currentColor;border-radius:1px;font-style:normal}
  .al-l i:nth-child(1){width:100%}.al-l i:nth-child(2){width:65%}.al-l i:nth-child(3){width:85%}
  .al-c i{margin:0 auto}.al-c i:nth-child(1){width:100%}.al-c i:nth-child(2){width:60%}.al-c i:nth-child(3){width:80%}
  .al-r i{margin-left:auto}.al-r i:nth-child(1){width:100%}.al-r i:nth-child(2){width:65%}.al-r i:nth-child(3){width:85%}
  .al-j i{width:100%}
  .toolbar .sep{width:1px;height:20px;background:var(--line);margin:0 2px}
  .toolbar select{border:1px solid var(--line);background:var(--panel);border-radius:8px;height:28px;padding:0 6px;font-size:12px;font-family:inherit;color:var(--ink)}
  .swatches{display:flex;gap:3px;align-items:center}
  .sw{width:16px;height:16px;border-radius:4px;border:1px solid rgba(0,0,0,.15);cursor:pointer}
  .tlabel{font-size:10.5px;color:var(--ink-faint);margin:0 1px 0 3px;font-weight:600}

  /* --- Bảng màu popup đầy đủ: xem shared-colorpop.css (dùng chung cả 4 app) --- */
  .clr-trig{width:17px;height:17px;border-radius:4px;cursor:pointer;border:1.5px solid var(--line);display:inline-flex;flex:0 0 auto;vertical-align:middle}
  .clr-open{padding:0 2px;min-width:14px!important;width:auto!important}

  /* import overlay */
  .hint{font-size:12.5px;color:var(--ink-soft);margin-top:6px}
  .ctx{position:fixed;z-index:75;background:var(--green-deep);color:#fff;border-radius:11px;padding:5px;display:none;gap:2px;box-shadow:0 8px 26px rgba(0,0,0,.3);align-items:center}
  .ctx button{background:transparent;border:none;color:#fff;font-size:13px;padding:6px 9px;border-radius:8px;display:inline-flex;align-items:center;gap:5px;cursor:pointer;font-family:inherit}
  .ctx button:hover{background:rgba(255,255,255,.16)}
  .ctx .sw{width:18px;height:18px;border-radius:5px;border:1px solid rgba(255,255,255,.3);padding:0;cursor:pointer}
  .ctx .sep{width:1px;height:18px;background:rgba(255,255,255,.25)}
  @media (max-width:760px){
    aside{width:84vw}
    .meta-grid{grid-template-columns:1fr}
    header .search input{width:140px}
  }
  .menu-toggle{display:inline-flex;align-items:center}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}

  .backup-banner{display:none;align-items:center;gap:12px;background:var(--red-tint);border-bottom:1px solid #f0c8c1;
    color:var(--red);padding:9px 20px;font-size:13.5px;font-weight:600}
  .backup-banner button{border:1px solid var(--red);background:var(--red);color:#fff;border-radius:7px;padding:6px 12px;font-weight:700;font-size:12.5px}
  .backup-banner button.ghost{background:#fff;color:var(--red)}
  .backup-banner button:hover{opacity:.88}
  .btn.read{background:var(--green-tint);color:var(--green-deep)}
  .btn.read:hover{background:#d7e8e1}
  .editor.read-mode .toolbar{display:none}
  .editor.read-mode .editable{cursor:text}

  .wordcount{font-size:12px;color:var(--green-deep);text-align:right;padding:2px 18px 10px;font-weight:700}
  .vocab-sec>summary .num{background:#6A4A86}
  .vocab-wrap,.corr-wrap{padding:12px 18px 16px}
  .vocab-add{font-size:13px;border:1px dashed #6A4A86;color:#6A4A86;background:#F3EEF8;border-radius:8px;padding:7px 12px;font-weight:700;margin-bottom:12px}
  .vocab-add:hover{background:#e9e0f2}
  .vocab-card{border:1px solid var(--line);border-left:4px solid #6A4A86;border-radius:10px;padding:10px 12px;margin-bottom:10px;background:#FCFBFE}
  .vocab-card .row1{display:flex;gap:8px;align-items:center;margin-bottom:6px}
  .vocab-card .vword{font-family:var(--zh-serif);font-size:18px;font-weight:700;border:none;background:transparent;width:120px;border-bottom:1px solid var(--line)}
  .vocab-card .vread{font-size:13px;color:#6A4A86;border:none;background:transparent;flex:1;border-bottom:1px solid var(--line)}
  .vocab-card .vdel{margin-left:auto;border:none;background:none;color:var(--red);font-size:15px;cursor:pointer}
  .vocab-card .vmean{width:100%;border:1px solid var(--line);border-radius:6px;padding:6px 8px;margin-bottom:6px;background:#fff}
  .vocab-card .vnote{width:100%;border:1px solid var(--line);border-radius:6px;padding:6px 8px;background:#fff;font-size:13px;color:var(--ink-soft)}
  .vocab-empty,.corr-empty{font-size:13px;color:var(--ink-faint);font-style:italic}
  .editable mark,mark{background:#FFF3A3;border-radius:2px;padding:0 1px}
  .corr-add{font-size:13px;border:1px dashed var(--green);color:var(--green-deep);background:var(--green-tint);border-radius:8px;padding:7px 12px;font-weight:700;margin-bottom:14px}
  .corr-add:hover{background:#d7e8e1}
  .corr-unit{border:1px solid var(--line);border-radius:10px;padding:12px 12px 12px;margin-bottom:16px;position:relative}
  .corr-unit .cnum{position:absolute;top:-9px;left:12px;background:#fff;font-size:11px;font-weight:700;color:var(--ink-soft);padding:0 6px}
  .corr-unit .cdel{position:absolute;top:6px;right:8px;border:none;background:none;color:var(--red);cursor:pointer;font-size:14px}
  .clab{font-size:11px;font-weight:700;display:block;margin:8px 0 3px}
  .corr-box{border-radius:8px;padding:8px 10px;min-height:32px;outline:none;line-height:1.6}
  .corr-box:empty:before{content:attr(data-ph);font-style:italic;font-size:13px;color:#bbb}
  .corr-box.orig{background:#2A2722;color:#F4F2E9;font-family:var(--zh-serif)}
  .corr-box.orig:empty:before{color:#888}
  .corr-box.err{background:var(--red-tint);color:var(--red);border:1px solid #f0c8c1}
  .corr-box.fix{background:var(--green-tint);color:var(--green-deep);border:1px solid #bfe0d6;font-family:var(--zh-serif)}

  .vchip{display:inline-block;margin:0 7px 7px 0;border:1px solid #d9cfe6;background:#F3EEF8;color:#5a3e78;
    font-family:var(--zh-serif);font-size:16px;font-weight:700;padding:5px 13px;border-radius:18px;cursor:pointer}
  .vchip:hover{background:#e9e0f2}
  mark.vocab{background:transparent;border-radius:3px;padding:0 2px;cursor:pointer}
  @keyframes flashHit{0%{box-shadow:0 0 0 0 rgba(47,107,94,.5)}40%{box-shadow:0 0 0 5px rgba(47,107,94,.35)}100%{box-shadow:0 0 0 0 rgba(47,107,94,0)}}
  mark.vocab.flash-hit{animation:flashHit 1.4s ease-out}
  mark.vocab:hover{background:#FFEA70}
  .vocab-backdrop{position:fixed;inset:0;background:rgba(30,28,24,.25);z-index:55;opacity:0;pointer-events:none;transition:.25s;display:none}
  .vocab-backdrop.open{opacity:1;pointer-events:auto}
  :root{--drawer-w:420px}
  .vocab-drawer{position:fixed;top:0;right:0;height:100vh;width:var(--drawer-w);max-width:94vw;background:var(--paper);
    border-left:1px solid var(--line);box-shadow:-10px 0 45px rgba(40,38,32,.16);transform:translateX(106%);
    transition:transform .25s ease;z-index:60;display:flex;flex-direction:column;overflow:hidden}
  .vocab-drawer.open{transform:none}
  .vd-resize{position:absolute;left:0;top:0;bottom:0;width:9px;cursor:col-resize;z-index:6;display:flex;align-items:center;justify-content:center;background:transparent}
  .vd-resize:hover{background:var(--green-tint)}
  .vd-resize:before{content:"";width:3px;height:40px;border-radius:3px;background:var(--line)}
  .vd-resize:hover:before{background:var(--green)}
  body.resizing{user-select:none;cursor:col-resize}
  body.resizing,body.resizing .vocab-drawer{transition:none!important}
  body{transition:padding-right .25s ease}
  body.drawer-open{padding-right:var(--drawer-w)}
  .vd-head{padding:18px 20px 15px;border-bottom:1px solid var(--line);background:#fff;position:relative}
  .vd-eyebrow{font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:var(--green);font-weight:700;margin-bottom:6px}
  .vd-word{font-family:var(--zh-serif);font-size:30px;font-weight:700;border:1px solid var(--line);border-radius:8px;background:#fff;width:100%;outline:none;letter-spacing:2px;color:var(--ink);padding:8px 10px;box-sizing:border-box;min-height:50px}
  .vd-word:empty:before{content:attr(data-ph);color:var(--ink-faint);font-weight:400}
  .vd-read{font-size:15px;color:var(--green);border:none;background:transparent;width:100%;outline:none;font-weight:600;margin-top:2px}
  .vd-close{position:absolute;top:14px;right:14px;width:30px;height:30px;border-radius:50%;border:none;background:var(--panel);font-size:15px;cursor:pointer;color:var(--ink-soft)}
  .vd-close:hover{background:#e6e2d6}
  .vd-toolbar{position:sticky;top:0;z-index:2;display:flex;gap:5px;align-items:center;background:#FFFDF7;border:1px solid var(--line);border-radius:9px;padding:6px 8px;margin:10px 0 2px;flex-wrap:wrap}
  .vd-toolbar button{border:1px solid var(--line);background:#fff;border-radius:6px;width:30px;height:30px;font-size:13px;font-weight:700;cursor:pointer;color:var(--ink)}
  .vd-toolbar button:hover{background:var(--panel)}
  .vd-toolbar .vt-hint{font-size:10.5px;color:var(--ink-soft);margin-left:auto;font-weight:600}
  .vd-body{padding:8px 20px 16px;overflow-y:auto;flex:1}
  .vd-field{margin-top:15px}
  .vd-flabel{font-size:11.5px;letter-spacing:.6px;text-transform:uppercase;color:var(--green);font-weight:700;margin-bottom:5px}

  .vd-rich:focus{outline:2px solid var(--green-tint);border-color:var(--green)}
  .vd-rich:empty:before{content:attr(data-ph);color:#b3ada1;font-style:italic}
  .vd-rich img{max-width:100%;border-radius:6px;margin:4px 0;display:block}

  .vd-del{margin:14px 20px 18px;border:1px solid #f0c8c1;background:var(--red-tint);color:var(--red);border-radius:8px;padding:10px;font-weight:700;cursor:pointer}
  .vd-del:hover{background:#f6d8d3}
  @media (max-width:760px){
    body.drawer-open{padding-right:0}
    .vocab-drawer{width:100vw;max-width:100vw}
    .vocab-backdrop{display:block}
    .vd-resize{display:none}
  }

  mark.anno{border-radius:3px;padding:0 2px;cursor:pointer}
  mark.anno.fix{background:#FBE4E0;border-bottom:2px solid var(--red)}
  mark.anno.fix:hover{background:#f7cfc7}
  mark.anno.note{background:#E1EFE9;border-bottom:2px solid var(--green)}
  mark.anno.note:hover{background:#cfe7dc}
  .anno-ref{margin-top:8px;font-family:var(--zh-serif);font-size:16px;background:var(--panel);border-radius:8px;padding:8px 11px;color:var(--ink);line-height:1.6;max-height:130px;overflow:auto}
</style>

<!-- #colorPop được shared-colorpop.js tự tạo -->

<script src="https://cdn.jsdelivr.net/npm/opencc-js@1.0.5/dist/umd/full.js"></script>
<script src="shared-colorpop.js"></script>
<script src="shared-selfmt.js"></script>
<script src="shared-nav.js"></script>
<script src="shared-vocab.js"></script>
<script src="shared-history.js"></script>
<script src="shared-paint.js"></script>
<script>
/* ============ STATE & STORAGE ============ */
const KEY = "hsk_writing_journal_v1";

/* ---------- kho từ vựng CHUNG (dùng chung với các app khác) ---------- */
const VOCAB_BANK_KEY="han_vocab_bank";
const APP_LABEL="📝 Viết luận HSK";
let vocabBank=[];
function loadVocabBank(){ try{ const s=localStorage.getItem(VOCAB_BANK_KEY); if(s){ const a=JSON.parse(s); if(Array.isArray(a)) return a; } }catch(e){} return []; }
// Thông báo nhỏ không chặn màn hình (khác alert() — không cần bấm OK mới gõ tiếp được).
// Có giới hạn tần suất: cùng 1 nội dung chỉ hiện lại sau ít nhất 60 giây, tránh làm phiền
// liên tục nếu lỗi cứ lặp lại mỗi lần gõ chữ.
let _lastToastMsg="", _lastToastTime=0;
function toast(msg){
  const now=Date.now();
  if(msg===_lastToastMsg && now-_lastToastTime<60000) return;
  _lastToastMsg=msg; _lastToastTime=now;
  let el=document.getElementById("_toastEl");
  if(!el){
    el=document.createElement("div"); el.id="_toastEl";
    el.style.cssText="position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#1e2d21;color:#fff;padding:10px 18px;border-radius:10px;font-size:13px;z-index:9999;max-width:90vw;text-align:center;box-shadow:0 4px 16px rgba(0,0,0,.2)";
    document.body.appendChild(el);
  }
  el.textContent=msg; el.style.display="block";
  clearTimeout(el._hideTimer);
  el._hideTimer=setTimeout(()=>{ el.style.display="none"; },4000);
}
function saveVocabBank(){ try{ localStorage.setItem(VOCAB_BANK_KEY, JSON.stringify(vocabBank)); }catch(e){ console.warn("saveVocabBank lỗi",e); if(e&&/quota/i.test(e.name||""))toast("⚠️ Bộ nhớ trình duyệt đầy — thẻ từ vừa sửa có thể chưa được lưu!"); } if(typeof vocabBankMirrorToIDB==="function") vocabBankMirrorToIDB(vocabBank); }
function cardsForEntry(eid){ return vocabBank.filter(v=>(v.occurrences||[]).some(o=>o.itemId===eid)); }
function resolveVocabId(vid){ const rec=vocabBank.find(v=>v.id===vid) || vocabBank.find(v=>(v.sourceIds||[]).includes(vid)); return rec?rec.id:vid; }
function ensureOccurrence(rec,eid){
  if(!Array.isArray(rec.occurrences)) rec.occurrences=[];
  if(!Array.isArray(rec.tags)) rec.tags=[];
  if(!rec.occurrences.some(o=>o.itemId===eid)){
    const e=state.entries.find(x=>x.id===eid);
    rec.occurrences.push({app:APP_LABEL, itemId:eid, itemTitle:(e&&e.title)||"(chưa đặt tên)", addedAt:Date.now()});
  }
}
/* occFor, extractWordStyle, wordStyleCSS: xem shared-vocab.js (dùng chung cả 4 app) */
function applyVocabMarkStyles(e){
  if(!e) return;
  FIELDS.forEach(f=>{
    const ed=document.getElementById("ed_"+f.k); if(!ed) return;
    vocabApplyStyles(ed, vocabBank, {id:e.id}, {tagName:"mark", className:"vocab"});
  });
}

/* ---------- Bước 2b: cơ chế "nhớ đường về" dùng chung giữa 5 app ---------- */
/* NAV_STACK_KEY, APP_FILE_MAP, navPushAndGo/navBack/navDismiss/renderNavBackPill: xem shared-nav.js (dùng chung cả 4 app) */
function goToOccurrence(occ,word){
  if(occ.app===APP_LABEL){ if(state.entries.some(x=>x.id===occ.itemId)) openEditor(occ.itemId); if(word) setTimeout(()=>{const rec=vocabBank.find(v=>v.word===word&&(v.occurrences||[]).some(o=>o.itemId===occ.itemId));if(rec)openVocabDrawer(rec.id);},80); return; }
  const file=APP_FILE_MAP[occ.app];
  if(!file){ alert("Không xác định được app đích"); return; }
  navPushAndGo(file+"?open="+encodeURIComponent(occ.itemId)+(word?"&word="+encodeURIComponent(word):""));
}
function goToOccurrenceArgs(app,itemId,itemTitle,word){ goToOccurrence({app,itemId,itemTitle}, word); }

const TYPES = {
  dang1: {vi:"Dạng 1 · Ứng dụng", zh:"应用文", cls:""},
  dang2: {vi:"Dạng 2 · Nghị luận", zh:"议论文", cls:"d2"}
};
let state = { entries:[], filter:{view:"all", type:null, sub:null}, currentId:null, readMode:false };
/* Tab / Shift+Tab để thụt lề: xem shared-selfmt.js (dùng chung cả 4 app) */
// ---- Ống hút định dạng: xem shared-paint.js (dùng chung cả 4 app) ----

function load(){
  try{ const raw=localStorage.getItem(KEY); if(raw) state.entries=JSON.parse(raw); }catch(e){ state.entries=[]; }
  if(!state.entries.length && !meta.seeded) state.entries = seedData();
  migrateEntries();
  vocabBank=loadVocabBank();
  try{ if(typeof migrateVocabBg==="function") migrateVocabBg(vocabBank); }catch(e){ console.warn("migrateVocabBg lỗi, bỏ qua bước gộp màu nền",e); }
  if(typeof vocabBankAutoHeal==="function"){
    vocabBankAutoHeal(vocabBank,(healed,added)=>{
      vocabBank=healed; saveVocabBank();
      const cur=getCurrent(); if(cur) renderVocabChips(cur);
      if(typeof toast==="function") toast(`✅ Đã tự khôi phục ${added} thẻ từ bị thiếu từ bản dự phòng.`);
    });
  }
  meta.seeded=true; saveMeta();
}
const REPS=[1,3,7,14,21,30,60,90,180];
const OLD_REVIEW_DAYS=[1,3,7,21,30]; // lịch cũ (5 mốc) — dùng để di trú đúng sang lịch mới
function migrateEntries(){
  state.entries.forEach(e=>{
    if(!e.id) e.id=uid();
    if(!Array.isArray(e.annos)) e.annos=[];
    if(Array.isArray(e.reviews)){ // di trú lịch ôn cũ (5 mốc plan/done) -> lịch chung 9 mốc + 1 mốc tự chọn
      if(!e.reps) e.reps={};
      e.reviews.forEach((r,i)=>{ if(r && r.done && OLD_REVIEW_DAYS[i]) e.reps[OLD_REVIEW_DAYS[i]]=r.done; });
      delete e.reviews;
    }
    if(!e.reps) e.reps={};
    if(e.repCustomLabel===undefined) e.repCustomLabel="";
    if(e.repCustomDone===undefined) e.repCustomDone="";
    if(!Array.isArray(e.vocab)) e.vocab=[];
    e.vocab.forEach(v=>{
      if(!v.id) v.id=uid();
      if(v.meaning!==undefined && !v.meaningVi) v.meaningVi=v.meaning;
      ["word","reading","thinking","meaningVi","meaningZh","structure","usage","distinguish","note"].forEach(k=>{ if(v[k]===undefined) v[k]=""; });
    });
    if(!Array.isArray(e.corrections)) e.corrections=[];
    if(!e.corrections.length && e.correction && e.correction.replace(/<[^>]*>/g,"").trim()){
      e.corrections=[{original:"",error:"",fixed:e.correction}];
    }
    if(e.correction!==undefined) delete e.correction;
  });
}
const META_KEY="hsk_meta_v1";
let meta={dirty:false,lastExport:null,seeded:false,script:"cn",pinyin:false};
function loadMeta(){ try{const m=localStorage.getItem(META_KEY); if(m) meta=Object.assign(meta,JSON.parse(m));}catch(e){} }
function saveMeta(){ try{localStorage.setItem(META_KEY,JSON.stringify(meta));}catch(e){} }
function updateBanner(){
  const b=document.getElementById("backupBanner"); if(!b) return;
  if(meta.dirty && !window._hideBanner){
    const last = meta.lastExport ? "Lần sao lưu gần nhất: "+fmt(meta.lastExport.slice(0,10)) : "Bạn chưa sao lưu lần nào";
    b.innerHTML=`<span>⚠ Có thay đổi chưa được sao lưu ra file. ${last}.</span>
      <button onclick="exportData()">⬇ Xuất sao lưu ngay</button>
      <button class="ghost" onclick="window._hideBanner=true;updateBanner()">Để sau</button>`;
    b.style.display="flex";
  } else { b.style.display="none"; }
}
function persist(){
  try{ localStorage.setItem(KEY, JSON.stringify(state.entries)); }
  catch(e){ toast("⚠️ Bộ nhớ trình duyệt đầy — bài viết vừa sửa có thể chưa được lưu. Hãy bấm ⬇ Xuất để sao lưu ngay."); }
  meta.dirty=true; saveMeta(); updateBanner();
}
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const today=()=>new Date().toISOString().slice(0,10);
function addDays(d,n){ const x=new Date(d); x.setDate(x.getDate()+n); return x.toISOString().slice(0,10); }
function fmt(d){ if(!d) return "—"; const [y,m,da]=d.split("-"); return `${da}/${m}/${y}`; }

/* ============ ENTRY MODEL ============
 { id, type, sub, title, prompt, topic,
   outline, teaching, notes, myEssay, correction, model,
   dateDone, reps:{day:doneDate}, repCustomLabel, repCustomDone, createdAt, updatedAt } */
function blankEntry(type){
  return { id:uid(), type:type||"dang1", sub:"", title:"", prompt:"", topic:"",
    outline:"", teaching:"", notes:"", myEssay:"", correction:"", model:"",
    vocab:[], corrections:[], annos:[],
    dateDone:today(),
    reps:{}, repCustomLabel:"", repCustomDone:"",
    createdAt:today(), updatedAt:today() };
}
function planDateFor(e,days){ return addDays(e.createdAt||e.dateDone||today(), days); }

/* ============ FILTER / DUE LOGIC ============ */
function isDue(e){
  return REPS.some(d=>!e.reps[d] && planDateFor(e,d)<=today());
}
function dueCount(){ return state.entries.filter(isDue).length; }
function visibleEntries(){
  let list=[...state.entries];
  const q=(document.getElementById("search")?.value||"").trim().toLowerCase();
  if(q){
    list=list.filter(e=>(e.title+" "+e.prompt+" "+e.sub+" "+e.topic).toLowerCase().includes(q));
  } else {
    if(state.filter.view==="due") list=list.filter(isDue);
    if(state.filter.type) list=list.filter(e=>e.type===state.filter.type);
    if(state.filter.sub) list=list.filter(e=>e.sub===state.filter.sub);
  }
  return list.sort((a,b)=> (b.updatedAt||"").localeCompare(a.updatedAt||""));
}
function subsOf(type){
  const m={};
  state.entries.filter(e=>e.type===type).forEach(e=>{ const s=e.sub||"(chưa phân loại)"; m[s]=(m[s]||0)+1; });
  return Object.entries(m).sort((a,b)=>a[0].localeCompare(b[0]));
}

/* ============ SIDEBAR ============ */
function renderSidebar(){
  const f=state.filter;
  const aside=document.getElementById("aside");
  const due=dueCount();
  let h="";
  h+=`<div class="nav-item ${f.view==='all'&&!f.type?'active':''}" onclick="setFilter('all',null,null)">
        📚 Tất cả bài <span class="count">${state.entries.length}</span></div>`;
  h+=`<div class="nav-item due ${f.view==='due'?'active':''}" onclick="setFilter('due',null,null)">
        📌 Cần ôn hôm nay <span class="count">${due}</span></div>`;
  for(const t of ["dang1","dang2"]){
    const info=TYPES[t]; const subs=subsOf(t);
    const tCount=state.entries.filter(e=>e.type===t).length;
    h+=`<div class="nav-sec">${info.vi} · <span class="zh">${info.zh}</span></div>`;
    h+=`<div class="sub-item ${f.type===t&&!f.sub?'active':''}" onclick="setFilter('all','${t}',null)">
          Tất cả <span class="count">${tCount}</span></div>`;
    if(subs.length){
      subs.forEach(([s,c])=>{
        h+=`<div class="sub-item ${f.type===t&&f.sub===s?'active':''}" onclick="setFilter('all','${t}',${JSON.stringify(s)})">
              ${escapeAttr(s)} <span class="count">${c}</span></div>`;
      });
    } else { h+=`<div class="sub-empty">chưa có bài</div>`; }
  }
  aside.innerHTML=h;
}
function setFilter(view,type,sub){
  state.filter={view,type,sub};
  if(document.getElementById("search")) document.getElementById("search").value="";
  state.currentId=null;
  toggleNav(false);
  render();
}

/* ============ LIST VIEW ============ */
function renderList(){
  const main=document.getElementById("main");
  const list=visibleEntries();
  const f=state.filter;
  let heading = f.view==="due" ? `📌 Cần ôn hôm nay` :
                f.sub ? f.sub :
                f.type ? TYPES[f.type].vi : `Tất cả bài`;
  let zh = f.type && !f.sub ? `<span class="zh">${TYPES[f.type].zh}</span>` : "";
  let h=`<div class="list-head"><h2>${escapeHtml(heading)}</h2>${zh}</div>`;
  if(!list.length){
    h+=`<div class="empty">Chưa có bài nào ở đây.<br><button class="hbtn primary" style="background:var(--green);color:#fff;border:none" onclick="newEntry()">＋ Tạo bài đầu tiên</button></div>`;
    main.innerHTML=h; return;
  }
  h+=`<div class="cards">`;
  list.forEach(e=>{
    const info=TYPES[e.type];
    const due=isDue(e);
    const seals=REPS.map(d=>`<div class="seal ${e.reps[d]?'done':''}" title="${e.reps[d]?'Đã ôn '+fmt(e.reps[d]):'Hẹn ôn '+fmt(planDateFor(e,d))}">${d}</div>`).join("")
      +`<div class="seal ${e.repCustomDone?'done':''}" title="${e.repCustomDone?'Đã ôn '+fmt(e.repCustomDone):'Mốc tự chọn'}">${e.repCustomLabel||"+"}</div>`;
    h+=`<div class="card ${due?'due-card':''}" onclick="openEditor('${e.id}')">
          <button class="card-del" onclick="event.stopPropagation();deleteEntryById('${e.id}')" title="Xoá bài">🗑</button>
          <span class="tag ${info.cls}">${info.zh}</span>${e.sub?`<span class="tag sub">${escapeHtml(e.sub)}</span>`:''}${due?'<span class="tag duepill">📌 tới hạn ôn</span>':''}
          <h3>${escapeHtml(e.title||"(chưa đặt tên)")}</h3>
          <div class="prompt">${escapeHtml(e.prompt||"—")}</div>
          <div class="meta">✍ ${fmt(e.dateDone)} <span class="seals">${seals}</span></div>
        </div>`;
  });
  h+=`</div>`;
  main.innerHTML=h;
}

/* ============ EDITOR VIEW ============ */
const FIELDS=[
  {k:"teaching",n:"一", vi:"Giảng dạy từng bước", zh:"讲解", essay:false, zhfont:false},
  {k:"notes",   n:"二", vi:"Kiến thức quan trọng", zh:"笔记", essay:false, zhfont:false},
  {k:"myEssay", n:"三", vi:"Bài làm của em", zh:"我的作文", essay:true, zhfont:true},
  {k:"model",   n:"四", vi:"Bài sửa của giáo viên", zh:"范文", essay:true, zhfont:true},
];
// Quét tất cả các ô (giảng dạy/ghi chú/bài làm/bài mẫu), tự động bọc mọi chữ đã có trong KHO TỪ VỰNG CHUNG
// (kể cả thẻ tạo ở app khác) bằng <mark class="vocab">. Bỏ qua phần đã bọc rồi.
// Ghi thêm occurrence cho thẻ đó nếu bài này chưa có. Trả về true nếu có thay đổi.
/* Lõi quét từ vựng (đệ quy, lồng nhau, tự ghi occurrence): xem shared-vocab.js (dùng chung cả 4 app) */
function autoDetectVocab(e){
  if(!e) return false;
  let changed=false;
  FIELDS.forEach(f=>{
    const ed=document.getElementById("ed_"+f.k); if(!ed) return;
    const r=vocabScanRoot(ed, vocabBank, {id:e.id, title:e.title, appLabel:APP_LABEL},
      {tagName:"mark", className:"vocab", excludeSelector:"mark.vocab,mark.anno,script,style"});
    if(r) changed=true;
  });
  if(changed){ readEditorsToData(e); }
  return changed;
}
function openEditor(id){ state.currentId=id; const e=getCurrent(); if(e&&typeof historySnapshot==="function") historySnapshot(e.id,()=>({...e})); render(); window.scrollTo(0,0); }
function getCurrent(){ return state.entries.find(e=>e.id===state.currentId); }

function renderEditor(){
  const e=getCurrent(); if(!e){ state.currentId=null; return render(); }
  const main=document.getElementById("main");
  const subList=[...new Set(state.entries.filter(x=>x.type===e.type&&x.sub).map(x=>x.sub))];
  let h=`<div class="editor ${state.readMode?'read-mode':''}">
    <div class="toolbar" id="toolbar">
      <button data-cmd="undo" title="Hoàn tác (Ctrl+Z)">↶</button>
      <button data-cmd="redo" title="Làm lại (Ctrl+Y)">↷</button>
      <span class="sep"></span>
      <button data-cmd="bold" title="Đậm (Ctrl+B)"><b>B</b></button>
      <button data-cmd="italic" title="Nghiêng (Ctrl+I)"><i>I</i></button>
      <button data-cmd="underline" title="Gạch chân"><u>U</u></button>
      <button data-cmd="strikeThrough" title="Gạch ngang"><s>S</s></button>
      <span class="sep"></span>
      <span class="tlabel">Cỡ</span>
      <button id="fsDown" title="Chữ nhỏ hơn (bôi đen chữ trước)">A−</button>
      <button id="fsUp" title="Chữ to hơn (bôi đen chữ trước)">A+</button>
      <span class="sep"></span>
      <span class="tlabel">Chữ</span>

let saveTimer=null, lastFocusEditable=null;
function bindEditor(e){
  // meta inputs
  ["title","sub","prompt","dateDone"].forEach(k=>{
    const el=document.getElementById("f_"+k);
    el.addEventListener("input",()=>{ e[k]=el.value; scheduleSave(); });
  });
  document.getElementById("f_type").addEventListener("change",ev=>{ e.type=ev.target.value; scheduleSave(); renderSidebar(); });
  document.getElementById("f_sub").addEventListener("change",()=>{ renderSidebar(); });
  // review dots (mốc cố định + mốc tự chọn)
  document.querySelectorAll("#main .rdot .ball[data-rep]").forEach(b=>{
    b.addEventListener("click",()=>{
      const d=b.dataset.rep;
      if(e.reps[d]) delete e.reps[d]; else e.reps[d]=today();
      scheduleSave(); renderSidebar(); renderEditor();
    });
  });
  document.querySelectorAll("#main .rdot .dt[data-rep-date]").forEach(dt=>{
    dt.addEventListener("input",()=>{ const d=dt.dataset.repDate; if(e.reps[d]) e.reps[d]=dt.value; scheduleSave(); renderSidebar(); });
  });
  const rcd=document.getElementById("rev_customDate");
  if(rcd) rcd.addEventListener("input",ev=>{ e.repCustomDone=ev.target.value; scheduleSave(); renderSidebar(); });
  const rcl=document.getElementById("rev_customLabel");
  if(rcl){
    rcl.addEventListener("input",ev=>{ e.repCustomLabel=ev.target.value; scheduleSave(); renderSidebar(); });
    rcl.addEventListener("click",ev=>ev.stopPropagation());
    const customDot=rcl.closest(".rdot");
    if(customDot) customDot.addEventListener("click",ev=>{ if(ev.target===rcl||ev.target.dataset.repDate!==undefined)return; e.repCustomDone=e.repCustomDone?"":today(); scheduleSave(); renderSidebar(); renderEditor(); });
  }
  // rich editors
  FIELDS.forEach(f=>{
    const ed=document.getElementById("ed_"+f.k);
    if(!ed) return;
    const isEssay=(f.k==='myEssay'||f.k==='model');
    ed.addEventListener("input",()=>{ e[f.k]=ed.innerHTML; if(isEssay) updateWC(f.k); scheduleSave(); if(typeof historyMaybeSnapshot==="function") historyMaybeSnapshot(e.id,()=>({...e})); });
    ed.addEventListener("focus",()=>{ lastFocusEditable=ed; });
    if(isEssay) updateWC(f.k);
  });
  // toolbar
  const tb=document.getElementById("toolbar");
  tb.querySelectorAll("button[data-cmd]").forEach(b=>{
    b.addEventListener("mousedown",ev=>ev.preventDefault());
    b.addEventListener("click",()=>exec(b.dataset.cmd));
  });
  const fsDown=document.getElementById("fsDown"), fsUp=document.getElementById("fsUp");
  if(fsDown){ fsDown.addEventListener("mousedown",ev=>ev.preventDefault()); fsDown.addEventListener("click",()=>applySize(-1)); }
  if(fsUp){ fsUp.addEventListener("mousedown",ev=>ev.preventDefault()); fsUp.addEventListener("click",()=>applySize(1)); }
  const paintBtn=document.getElementById("paintBtn");
  if(paintBtn){ paintBtn.addEventListener("mousedown",ev=>ev.preventDefault()); paintBtn.addEventListener("click",()=>togglePaintMode([paintBtn,document.getElementById("ctxPaint")])); }
  wireToolbarColorTriggers();
}
function applySize(dir){
  const range=getSelRange();
  if(!range){ alert("Hãy bôi đen chữ cần đổi cỡ trước."); return; }
  const startEl=range.startContainer.nodeType===1?range.startContainer:range.startContainer.parentElement;
  const curSize=parseFloat(getComputedStyle(startEl).fontSize)||16;
  const newSize=Math.max(10,Math.min(72,Math.round(curSize+dir*2)));
  const ed=wrapRangeWithStyle(range,"fontSize",newSize+"px");
  if(!ed){ alert("Hãy bôi đen chữ cần đổi cỡ trước."); return; }
  lastFocusEditable=ed;
}
function exec(cmd,val){
  if(lastFocusEditable) lastFocusEditable.focus();
  try{ document.execCommand("styleWithCSS",false,true); }catch(e){}
  document.execCommand(cmd,false,val||null);
  const e=getCurrent(); if(e){ readEditorsToData(e); scheduleSave(); }
}

function wireToolbarColorTriggers(){

  hlBtn && hlBtn.addEventListener("mousedown",e=>{ e.preventDefault(); openColorPop("hl",hlBtn); });

function scheduleSave(){
  clearTimeout(saveTimer);

function saveNow(showList){
  const e=getCurrent(); if(e){ e.updatedAt=today(); }
  persist();
  const t=document.getElementById("savedTag"); if(t){ t.classList.add("show"); setTimeout(()=>t.classList.remove("show"),1200); }
  renderSidebar();
  if(showList) closeEditor();
}
function closeEditor(){ const e=getCurrent(); if(e) e.updatedAt=today(); persist(); state.currentId=null; state.readMode=meta.pinyin?true:false; render(); }

function openHistoryPanel(){

function deleteEntryById(id){
  const e=state.entries.find(x=>x.id===id); if(!e) return;
  if(confirm(`Xoá bài "${e.title||'(chưa đặt tên)'}"? Không thể hoàn tác.`)){
    state.entries=state.entries.filter(x=>x.id!==id);
    if(state.currentId===id) state.currentId=null;
    persist(); render();
  }

function deleteEntry(){

function newEntry(){
  const type = state.filter.type || "dang1";
  const e=blankEntry(type);
  if(state.filter.sub) e.sub=state.filter.sub;
  state.entries.unshift(e); persist(); openEditor(e.id);
}
function exportData(){
  const payload={__hanBackup:true,app:"SoLuyenViet_HSK",appData:state.entries,vocabBank:vocabBank,exportedAt:new Date().toISOString()};
  const blob=new Blob([JSON.stringify(payload,null,2)],{type:"application/json"});
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob);
  a.download="so-luyen-viet-hsk_"+today()+".json"; a.click(); URL.revokeObjectURL(a.href);
  meta.dirty=false; meta.lastExport=new Date().toISOString(); window._hideBanner=false; saveMeta(); updateBanner();
}
function importData(file){
  const r=new FileReader();
  r.onload=()=>{
    try{
      const raw=JSON.parse(r.result);
      const isWrapped=raw&&raw.__hanBackup===true;
      const data=isWrapped?raw.appData:raw;
      if(!Array.isArray(data)) throw 0;
      const incomingBank=(isWrapped&&Array.isArray(raw.vocabBank))?raw.vocabBank:null;
      const merge=confirm(`File có ${data.length} bài.\n\n• OK = GỘP (thêm bài mới, bỏ qua bài trùng).\n• Cancel = THAY THẾ toàn bộ (xoá hết hiện tại, chỉ giữ dữ liệu trong file).`);
      if(merge){
        const ids=new Set(state.entries.map(e=>e.id));
        data.forEach(e=>{ if(!ids.has(e.id)) state.entries.push(e); });
      } else { state.entries=data; }
      if(incomingBank){
        if(confirm(`File này có kèm kho từ vựng chung (${incomingBank.length} thẻ). Khôi phục kho chung này? (sẽ GHI ĐÈ kho hiện tại đang có ${vocabBank.length} thẻ)`)){
          vocabBank=incomingBank; saveVocabBank();
        }
      }
      migrateEntries(); meta.seeded=true; saveMeta();
      persist(); state.currentId=null; render();
      alert("Đã nhập dữ liệu xong.");
    }catch(e){ alert("File không hợp lệ. Hãy chọn file .json đã xuất từ app này."); }
  };
  r.readAsText(file);
}

/* ============ HELPERS ============ */
function escapeHtml(s){ return (s||"").replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c])); }
function buildStyledWordHTML(c){
  const w=escapeHtml(c.word||"");
  if(!c.wordStyle) return w;
  const st=c.wordStyle;
  let inner=`<span style="${(st.color?`color:${st.color};`:"")}${(st.bg?`background-color:${st.bg};`:"")}">${w}</span>`;
  if(st.strike) inner=`<s>${inner}</s>`;
  if(st.underline) inner=`<u>${inner}</u>`;
  if(st.italic) inner=`<i>${inner}</i>`;
  if(st.bold) inner=`<b>${inner}</b>`;
  return inner;
}
function escapeAttr(s){ return (s||"").replace(/"/g,"&quot;").replace(/</g,"&lt;"); }

function readEditorsToData(e){
  FIELDS.forEach(f=>{ const ed=document.getElementById("ed_"+f.k); if(ed) e[f.k]=ed.innerHTML; });

function cjkCount(html){ const t=document.createElement("div"); t.innerHTML=html; const x=(t.textContent||"").match(/[\u4e00-\u9fff]/g); return x?x.length:0; }
function updateWC(k){ const el=document.getElementById("wc_"+k), ed=document.getElementById("ed_"+k); if(el&&ed) el.textContent="字数 (chữ Hán): "+cjkCount(ed.innerHTML); }

function addCorrection(){ const e=getCurrent(); if(!e) return; e.corrections.push({original:"",error:"",fixed:""}); persist(); renderCorrList(e); }
function delCorrection(i){ const e=getCurrent(); if(!e) return; if(confirm("Xoá câu "+(i+1)+"?")){ e.corrections.splice(i,1); persist(); renderCorrList(e); } }
function renderCorrList(e){ const el=document.getElementById("corrList"); if(el){ el.innerHTML=corrRowsHTML(e); bindCorr(e); } }
function bindCorr(e){
  e.corrections.forEach((c,i)=>{ ["original","error","fixed"].forEach(fld=>{
    const ed=document.getElementById("corr_"+i+"_"+fld); if(!ed) return;
    ed.addEventListener("input",()=>{ c[fld]=ed.innerHTML; scheduleSave(); });

function vocabChipsHTML(e){
  const cards=cardsForEntry(e.id);

function bindDrawerRich(el,onChange){
  el.addEventListener("focus",()=>{ drawerFocus=el; });

  el.addEventListener("paste",ev=>{
    const cd=ev.clipboardData||window.clipboardData; if(!cd) return;
    const items=cd.items||[];
    for(const it of items){
      if(it.type && it.type.indexOf("image")===0){
        ev.preventDefault();
        const file=it.getAsFile(); const rd=new FileReader();
        rd.onload=()=>{ insertHTMLAtCaret(el,'<img src="'+rd.result+'">'); onChange(el.innerHTML); scheduleSave(); };
        rd.readAsDataURL(file); return;

function ensureResizeHandle(){

  dr.appendChild(h);

function startDrawerResize(ev){
  ev.preventDefault();
  const onMove=e=>{
    const x = e.clientX!=null ? e.clientX : (e.touches&&e.touches[0].clientX);
    let w = window.innerWidth - x;
    const maxW = Math.min(window.innerWidth*0.8, 920);
    w = Math.max(300, Math.min(maxW, w));
    document.documentElement.style.setProperty("--drawer-w", w+"px");
  };
  const onUp=()=>{
    document.removeEventListener("mousemove",onMove);
    document.removeEventListener("mouseup",onUp);
    document.body.classList.remove("resizing");
    const w=getComputedStyle(document.documentElement).getPropertyValue("--drawer-w").trim();
    try{ meta.drawerW=w; saveMeta(); }catch(_){}
  };
  document.body.classList.add("resizing");
  document.addEventListener("mousemove",onMove);
  document.addEventListener("mouseup",onUp);
}

let ctxSel=null;
function wireCtxMenu(){
  const ctx=document.getElementById("ctx");
  document.addEventListener("contextmenu",e=>{
    const ed=e.target.closest && e.target.closest('[contenteditable="true"]');
    const sel=window.getSelection();
    if(ed && sel && sel.rangeCount && !sel.isCollapsed && ed.closest("#main")){
      e.preventDefault();
      lastFocusEditable=ed;
      ctxSel=sel.getRangeAt(0).cloneRange();
      ctx.style.display="flex";
      const x=Math.min(window.innerWidth-ctx.offsetWidth-8,e.clientX), y=Math.min(window.innerHeight-ctx.offsetHeight-8,e.clientY);
      ctx.style.left=x+"px"; ctx.style.top=y+"px";
    } else ctx.style.display="none";
  });
  document.addEventListener("click",e=>{ if(!e.target.closest("#ctx")) ctx.style.display="none"; });
  ctx.querySelectorAll("button[data-cmd]").forEach(b=>{
    b.addEventListener("mousedown",ev=>ev.preventDefault());
    b.addEventListener("click",()=>{ restoreCtxSel(); exec(b.dataset.cmd); ctx.style.display="none"; });
  });
  const hl=document.getElementById("ctxHl"); hl.style.background="#e4dfd2";
  hl.addEventListener("mousedown",ev=>ev.preventDefault());
  hl.addEventListener("click",()=>{ restoreCtxSel(); openColorPop("hl",hl); ctx.style.display="none"; });
  const fc=document.getElementById("ctxFc");
  fc.addEventListener("mousedown",ev=>ev.preventDefault());
  fc.addEventListener("click",()=>{ restoreCtxSel(); openColorPop("fc",fc); ctx.style.display="none"; });
  const paintCtx=document.getElementById("ctxPaint");
  paintCtx.addEventListener("mousedown",ev=>ev.preventDefault());
  paintCtx.addEventListener("click",()=>{ restoreCtxSel(); ctx.style.display="none"; togglePaintMode([document.getElementById("paintBtn"),paintCtx]); });
  document.getElementById("ctxVocab").addEventListener("mousedown",ev=>ev.preventDefault());
  document.getElementById("ctxVocab").addEventListener("click",()=>{ restoreCtxSel(); markVocabFromSelection(); ctx.style.display="none"; });
  document.getElementById("ctxNote").addEventListener("mousedown",ev=>ev.preventDefault());
  document.getElementById("ctxNote").addEventListener("click",()=>{ restoreCtxSel(); markAnnoFromSelection(); ctx.style.display="none"; });
}
function restoreCtxSel(){
  if(!ctxSel) return;
  try{ const sel=window.getSelection(); sel.removeAllRanges(); sel.addRange(ctxSel); lastFocusEditable&&lastFocusEditable.focus(); }catch(e){}
}

/* ============================================================
   简 ⇄ 繁  Giản thể ⇄ Phồn thể (opencc-js) — áp dụng TOÀN BỘ app

let occS2T=null, occT2S=null;
function occReady(){
  if(typeof OpenCC==="undefined") return false;
  if(!occS2T){ occS2T=OpenCC.Converter({from:"cn",to:"tw"}); occT2S=OpenCC.Converter({from:"tw",to:"cn"}); }
  return true;
}
function occConv(){ return occReady()?(meta.script==="tw"?occS2T:occT2S):null; }
const scriptObserver=new MutationObserver(muts=>{
  if(meta.script!=="tw") return;
  const roots=new Set();
  muts.forEach(m=>{
    if(m.type==="characterData") roots.add(m.target.parentElement||m.target);
    else if(m.type==="childList") m.addedNodes.forEach(nd=>{ if(nd.nodeType===1||nd.nodeType===3) roots.add(nd); });
  });
  roots.forEach(r=>{ if(r && document.body.contains(r)) convertTextIn(r); });
});
function convertTextIn(root){
  const conv=occConv(); if(!conv||!root) return;
  scriptObserver.disconnect();
  try{
    if(root.nodeType===3){
      const v=conv(root.nodeValue); if(v!==root.nodeValue) root.nodeValue=v;
    } else if(root.nodeType===1){
      const walker=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,{acceptNode(n){
        const p=n.parentElement;
        return(p&&p.closest&&p.closest("script,style,rt"))?NodeFilter.FILTER_REJECT:NodeFilter.FILTER_ACCEPT;
      }});
      const nodes=[]; let n; while(n=walker.nextNode()) nodes.push(n);
      nodes.forEach(node=>{ try{ const v=conv(node.nodeValue); if(v!==node.nodeValue) node.nodeValue=v; }catch(e){} });
      if(root.tagName==="INPUT"||root.tagName==="TEXTAREA"){
        try{ const v=conv(root.value); if(v!==root.value) root.value=v; }catch(e){}
      }
      if(root.querySelectorAll) root.querySelectorAll("input,textarea").forEach(el=>{
        try{ const v=conv(el.value); if(v!==el.value) el.value=v; }catch(e){}
      });
    }
  }catch(e){}
  scriptObserver.observe(document.body,{childList:true,subtree:true,characterData:true});
}
function applyScriptBtn(){
  const tw=meta.script==="tw";
  const b=document.getElementById("scriptToggle"); if(!b) return;
  b.classList.toggle("on",tw);
  b.textContent=tw?"繁→简":"简→繁";
  b.title=tw?"Đang hiển thị Phồn thể (toàn app) — bấm để chuyển về Giản thể":"Đang hiển thị Giản thể — bấm để chuyển sang Phồn thể (toàn app)";
}
document.getElementById("scriptToggle").addEventListener("click",()=>{
  if(!occReady()){ alert("Bộ chuyển đổi chữ Hán chưa tải xong — kiểm tra kết nối mạng rồi thử lại."); return; }
  meta.script = meta.script==="tw" ? "cn" : "tw";
  convertTextIn(document.body);
  applyScriptBtn();
  saveMeta();
});

   拼音  Pinyin trên từng chữ (pinyin-pro, load động) — áp dụng TOÀN BỘ app
   Để tránh hỏng dữ liệu khi có ruby/rt chen vào nội dung đang soạn,
   lúc bật pinyin app sẽ tự chuyển sang "👁 Chế độ đọc" (không sửa được).
   ============================================================ */
let _prevReadModeBeforePinyin=null;
function loadPinyinPro(cb){
  if(typeof pinyinPro!=="undefined"){ cb(); return; }
  const s=document.createElement("script");
  s.src="https://unpkg.com/pinyin-pro@3.24.2/dist/index.js";
  s.onload=cb;
  s.onerror=()=>alert("❌ Không tải được thư viện pinyin — kiểm tra kết nối mạng rồi thử lại.");
  document.head.appendChild(s);
}
function annotatePinyin(root){
  if(typeof pinyinPro==="undefined"||!root) return;
  const {pinyin}=pinyinPro;
  const walker=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,{acceptNode(n){
    if(!n.nodeValue||!/[\u4e00-\u9fff]/.test(n.nodeValue)) return NodeFilter.FILTER_SKIP;
    const p=n.parentElement;
    return(p&&p.closest&&p.closest("script,style,rt"))?NodeFilter.FILTER_REJECT:NodeFilter.FILTER_ACCEPT;
  }});
  const nodes=[]; let n; while(n=walker.nextNode()) nodes.push(n);
  nodes.forEach(node=>{
    try{
      const text=node.nodeValue;
      const pyArr=pinyin(text,{type:"array",toneType:"symbol"});
      const frag=document.createDocumentFragment();
      let ci=0;
      for(let i=0;i<text.length;i++){
        const ch=text[i];
        if(/[\u4e00-\u9fff]/.test(ch)){
          const py=pyArr[ci++]||"";
          const wrap=document.createElement("span"); wrap.className="py-result-item";
          const ruby=document.createElement("ruby");
          const cspan=document.createElement("span"); cspan.className="py-chinese-item"; cspan.textContent=ch;
          const rt=document.createElement("rt"); rt.className="py-pinyin-item"; rt.textContent=py;
          ruby.appendChild(cspan); ruby.appendChild(rt); wrap.appendChild(ruby); frag.appendChild(wrap);
        } else { frag.appendChild(document.createTextNode(ch)); ci++; }
      }
      node.parentNode.replaceChild(frag,node);
    }catch(e){}
  });
}
function stripPinyinHTML(html){
  if(!html||html.indexOf("py-result-item")<0) return html;
  const tmp=document.createElement("div"); tmp.innerHTML=html;
  tmp.querySelectorAll(".py-result-item").forEach(item=>{
    const ch=item.querySelector(".py-chinese-item");
    item.replaceWith(document.createTextNode(ch?ch.textContent:item.textContent));
  });
  return tmp.innerHTML;
}
const pinyinObserver=new MutationObserver(muts=>{
  if(!meta.pinyin) return;
  const roots=new Set();
  muts.forEach(m=>{
    if(m.type==="childList") m.addedNodes.forEach(nd=>{ if(nd.nodeType===1) roots.add(nd); });
  });
  roots.forEach(r=>{ if(r && document.body.contains(r)){ pinyinObserver.disconnect(); annotatePinyin(r); pinyinObserver.observe(document.body,{childList:true,subtree:true}); } });
});
function applyPinyinBtn(){
  const on=!!meta.pinyin;
  const b=document.getElementById("pinyinToggle"); if(!b) return;

  b.title=on?"Đang hiện pinyin (toàn app, ở chế độ đọc) — bấm để ẩn":"Bấm để hiện pinyin trên mọi chữ Hán trong app (sẽ chuyển sang chế độ đọc)";
}
document.getElementById("pinyinToggle").addEventListener("click",()=>{

    loadPinyinPro(()=>{
      meta.pinyin=true;
      // ép sang chế độ đọc để không gõ nhầm lên nội dung đã chèn ruby/pinyin
      if(_prevReadModeBeforePinyin===null) _prevReadModeBeforePinyin=state.readMode;
      state.readMode=true;
      render();
      applyPinyinBtn();
      pinyinObserver.disconnect();
      annotatePinyin(document.getElementById("aside"));
      annotatePinyin(document.getElementById("main"));
      const vd=document.getElementById("vocabDrawer"); if(vd) annotatePinyin(vd);
      pinyinObserver.observe(document.body,{childList:true,subtree:true});
      saveMeta();
    });
  } else {
    meta.pinyin=false;
    if(_prevReadModeBeforePinyin!==null){ state.readMode=_prevReadModeBeforePinyin; _prevReadModeBeforePinyin=null; }
    render();
    applyPinyinBtn();
    saveMeta();
  }
});

/* ---- khởi động: áp dụng lại lựa chọn Phồn/Pinyin đã lưu ---- */
(function initScriptPinyin(){
  applyScriptBtn();
  applyPinyinBtn();
  scriptObserver.observe(document.body,{childList:true,subtree:true,characterData:true});
  if(meta.script==="tw") convertTextIn(document.body);
  if(meta.pinyin){
    loadPinyinPro(()=>{
      pinyinObserver.disconnect();
      annotatePinyin(document.getElementById("aside"));
      annotatePinyin(document.getElementById("main"));
      pinyinObserver.observe(document.body,{childList:true,subtree:true});
    });
  }
})();

</script>

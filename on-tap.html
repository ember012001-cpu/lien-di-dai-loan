<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>🔁 Ôn tập từ vựng · 汉学</title>
<style>
:root{
  --paper:#f7f3e8;--paper-2:#f4f2e9;--paper-3:#e4dfd2;--ink:#2a2722;--ink-soft:#6b655b;
  --green:#2f6b5e;--green-soft:#e5f0ec;--green-deep:#1e2d21;
  --red:#c0392b;--red-soft:#fbe9e6;--kai:'KaiTi','楷体',serif;--ui:'Quicksand',system-ui,sans-serif;
  --radius:16px;--shadow:0 4px 24px rgba(44,60,44,.10);
}
*{box-sizing:border-box}
body{margin:0;font-family:var(--ui);background:var(--paper);color:var(--ink);min-height:100vh;padding-bottom:60px}
header{background:var(--green-deep);color:#fff;padding:18px 20px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:20}
header a{color:#fff;text-decoration:none;font-size:20px;opacity:.85}
header a:hover{opacity:1}
header h1{font-size:16px;margin:0;font-weight:700;letter-spacing:.3px}
.wrap{max-width:720px;margin:0 auto;padding:22px 16px}

/* ---- Trang chủ ôn tập ---- */
.summary-bar{background:#fff;border:1.5px solid var(--paper-3);border-radius:var(--radius);box-shadow:var(--shadow);
  padding:20px 22px;margin-bottom:20px;display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap}
.summary-bar .big{font-size:28px;font-weight:700;color:var(--green)}
.summary-bar .lbl{font-size:13px;color:var(--ink-soft)}
.btn{border:none;border-radius:12px;padding:12px 20px;font-size:14px;font-weight:700;cursor:pointer;font-family:var(--ui)}
.btn-main{background:var(--green);color:#fff}
.btn-main:hover{background:var(--green-deep)}
.btn-main:disabled{background:#c8c2b2;cursor:default}
.btn-outline{background:#fff;color:var(--green);border:1.5px solid var(--green)}
.btn-outline:hover{background:var(--green-soft)}
.btn-outline:disabled{color:#a8a296;border-color:#c8c2b2;cursor:default}
.item-row{background:#fff;border:1.5px solid var(--paper-3);border-radius:14px;padding:14px 18px;margin-bottom:10px;
  display:flex;align-items:center;gap:14px;cursor:pointer;transition:.15s}
.item-row:hover{border-color:var(--green);box-shadow:0 4px 16px rgba(44,60,44,.08)}
.item-row .ic{font-size:22px;flex:0 0 auto}
.item-row .info{flex:1;min-width:0}
.item-row .title{font-weight:700;font-size:14.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item-row .app{font-size:11.5px;color:var(--ink-soft)}
.item-row .count{background:var(--green-soft);color:var(--green);border-radius:20px;padding:4px 12px;font-size:13px;font-weight:700;flex:0 0 auto}
.row-dl-btn{background:none;border:1.5px solid var(--paper-3);border-radius:8px;font-size:15px;padding:5px 8px;cursor:pointer;flex:0 0 auto}
.row-dl-btn:hover{border-color:var(--green);background:var(--green-soft)}
.empty-msg{text-align:center;padding:60px 20px;color:var(--ink-soft)}
.empty-msg .big-emoji{font-size:44px;margin-bottom:14px}

/* ---- Phiên ôn tập ---- */
.progress-wrap{margin-bottom:18px}
.progress-bar{height:8px;background:var(--paper-3);border-radius:8px;overflow:hidden}
.progress-fill{height:100%;background:var(--green);transition:width .25s}
.progress-txt{font-size:12px;color:var(--ink-soft);margin-top:6px;text-align:center}
.qcard{background:#fff;border:1.5px solid var(--paper-3);border-radius:var(--radius);box-shadow:var(--shadow);
  padding:34px 26px;text-align:center;min-height:200px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px}
.qcard .han-big{font-family:var(--kai);font-size:56px;color:var(--ink);letter-spacing:2px}
.qcard .meaning-big{font-size:20px;color:var(--ink);line-height:1.5;max-width:480px}
.qcard .hint{font-size:12px;color:var(--ink-soft)}
.speak-btn{border:2px solid var(--green);background:var(--green-soft);color:var(--green);border-radius:50%;
  width:64px;height:64px;font-size:26px;cursor:pointer}
.speak-btn:hover{background:var(--green);color:#fff}
.options{display:grid;gap:10px;margin-top:18px}
.opt-btn{background:#fff;border:1.5px solid var(--paper-3);border-radius:12px;padding:14px 16px;font-size:16px;
  cursor:pointer;text-align:left;font-family:var(--kai);transition:.12s}
.opt-btn.meaning{font-family:var(--ui);font-size:14.5px;text-align:left}
.opt-btn:hover{border-color:var(--green);background:var(--green-soft)}
.opt-btn.correct{border-color:var(--green);background:var(--green-soft);color:var(--green-deep);font-weight:700}
.opt-btn.wrong{border-color:var(--red);background:var(--red-soft);color:var(--red)}
.tf-row{display:flex;gap:12px;margin-top:10px}
.tf-row button{flex:1;padding:16px;font-size:16px;font-weight:700;border-radius:12px;border:1.5px solid var(--paper-3);
  background:#fff;cursor:pointer}
.tf-row button:hover{border-color:var(--green)}
#typeInput{width:100%;max-width:280px;font-family:var(--kai);font-size:24px;text-align:center;padding:12px;
  border:1.5px solid var(--paper-3);border-radius:12px;margin-top:8px}
.feedback{margin-top:16px;padding:12px 16px;border-radius:10px;font-size:14px}
.feedback.ok{background:var(--green-soft);color:var(--green-deep)}
.feedback.no{background:var(--red-soft);color:var(--red)}
.next-btn{margin-top:16px}
.session-bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.session-bar .exit{font-size:13px;color:var(--ink-soft);cursor:pointer;text-decoration:underline;background:none;border:none;font-family:var(--ui)}

/* ---- Kết quả ---- */
.result-card{background:#fff;border:1.5px solid var(--paper-3);border-radius:var(--radius);box-shadow:var(--shadow);
  padding:36px 26px;text-align:center}
.result-card .score{font-size:42px;font-weight:700;color:var(--green);margin-bottom:6px}
.result-card .desc{color:var(--ink-soft);margin-bottom:20px}
.hidden{display:none!important}
</style>
</head>
<body>

<header>
  <a href="index.html" title="Về trang chủ">🏠</a>
  <h1>🔁 Ôn tập từ vựng</h1>
</header>

<div class="wrap">

  <!-- ===== Trang chủ ôn tập ===== -->
  <div id="homeView">
    <div class="summary-bar">
      <div>
        <div class="big" id="totalDueCount">0</div>
        <div class="lbl">từ cần ôn hôm nay (tất cả các bài)</div>
      </div>
      <button class="btn btn-main" id="reviewAllBtn">▶ Ôn tất cả hôm nay</button>
      <button class="btn btn-outline" id="printViewBtn">🎨 Xem đẹp / In (giữ màu)</button>
      <button class="btn btn-outline" id="downloadListBtn">📥 Tải file chữ thường (.txt)</button>
    </div>
    <div id="itemGroups"></div>
    <div id="emptyMsg" class="empty-msg hidden">
      <div class="big-emoji">🎉</div>
      <div>Không có từ nào cần ôn hôm nay!<br>Quay lại học tiếp rồi ôn sau nhé.</div>
    </div>
  </div>

  <!-- ===== Phiên ôn tập ===== -->
  <div id="reviewView" class="hidden">
    <div class="session-bar">
      <button class="exit" id="exitBtn">← Thoát ôn tập</button>
      <span id="sessionTitle" style="font-size:13px;color:var(--ink-soft)"></span>
    </div>
    <div class="progress-wrap">
      <div class="progress-bar"><div class="progress-fill" id="progFill" style="width:0%"></div></div>
      <div class="progress-txt" id="progTxt">Câu 1/1</div>
    </div>
    <div class="qcard" id="qcard"></div>
  </div>

  <!-- ===== Kết quả ===== -->
  <div id="resultView" class="hidden">
    <div class="result-card">
      <div class="score" id="resultScore">0/0</div>
      <div class="desc" id="resultDesc">Bạn đã ôn xong!</div>
      <button class="btn btn-main" id="backHomeBtn">Về trang ôn tập</button>
    </div>
  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/opencc-js@1.0.5/dist/umd/full.js"></script>
<script src="shared-vocab.js"></script>
<script src="shared-vocab-review.js"></script>
<script>
"use strict";
const VOCAB_BANK_KEY="han_vocab_bank";
const APP_ICON={"📖 Luyện đọc hiểu":"📖","🎤 Luyện nói":"🎤","🎧 Luyện nghe":"🎧","📝 Viết luận HSK":"📝"};

function loadBank(){ try{ const s=localStorage.getItem(VOCAB_BANK_KEY); if(s){ const a=JSON.parse(s); if(Array.isArray(a)) return a; } }catch(e){} return []; }
function saveBank(){ try{ localStorage.setItem(VOCAB_BANK_KEY, JSON.stringify(bank)); }catch(e){ console.warn("Không lưu được kho từ vựng",e); } if(typeof vocabBankMirrorToIDB==="function") vocabBankMirrorToIDB(bank); }

let bank=loadBank();
let groups=[];
let session=null; // {words:[...], idx, correct, wrong:[], curQuestion, title}

function $(s){ return document.querySelector(s); }

/* ---------- Trang chủ ---------- */
function renderHome(){
  let raw=(window.vocabGroupDueByItem?vocabGroupDueByItem(bank):[])
    .filter(g=>!g.itemId || typeof occItemExists!=="function" || occItemExists({app:g.app,itemId:g.itemId}));
  // GỘP THEO TÊN BÀI: nếu cùng 1 bài lỡ bị tách thành nhiều mã số khác nhau trong dữ liệu
  // (VD do lỗi tạo trùng bài trước đây), gộp lại ở đây để hiện đúng TỔNG thật của từng bài —
  // không sửa dữ liệu gốc, chỉ gộp ở bước hiển thị.
  const byTitle=new Map();
  raw.forEach(g=>{
    const key=(g.app||'')+'|'+(g.itemTitle||'');
    if(!byTitle.has(key)) byTitle.set(key,{app:g.app,itemId:g.itemId,itemTitle:g.itemTitle,words:[],mergedIds:new Set()});
    const grp=byTitle.get(key);
    grp.mergedIds.add(g.itemId);
    g.words.forEach(w=>{ if(!grp.words.some(x=>x.id===w.id)) grp.words.push(w); });
  });
  groups=[...byTitle.values()].sort((a,b)=>b.words.length-a.words.length);
  const total=new Set();
  groups.forEach(g=>g.words.forEach(w=>total.add(w.id)));
  $("#totalDueCount").textContent=total.size;
  $("#reviewAllBtn").disabled=total.size===0;
  $("#printViewBtn").disabled=total.size===0;
  $("#downloadListBtn").disabled=total.size===0;
  const wrap=$("#itemGroups"); wrap.innerHTML="";
  $("#emptyMsg").classList.toggle("hidden", groups.length>0);
  groups.forEach(g=>{
    const row=document.createElement("div"); row.className="item-row";
    const icon=APP_ICON[g.app]||"🗂";
    const mergedNote=g.mergedIds&&g.mergedIds.size>1?`<div style="font-size:11px;color:#c0392b">⚠️ Đã gộp ${g.mergedIds.size} mã bài trùng tên</div>`:"";
    row.innerHTML=`<span class="ic">${icon}</span>
      <span class="info"><div class="title">${escHtml(g.itemTitle)}</div><div class="app">${escHtml(g.app||"")}</div>${mergedNote}</span>
      <span class="count">${g.words.length} từ</span>
      <button class="row-dl-btn" data-act="diag" title="Kiểm tra chi tiết nếu số từ có vẻ thiếu so với thực tế">🔍</button>
      <button class="row-dl-btn" data-act="print" title="Xem đẹp / in riêng bài này (giữ màu)">🎨</button>
      <button class="row-dl-btn" data-act="txt" title="Tải riêng file chữ thường của bài này">📥</button>`;
    row.querySelector('[data-act="diag"]').onclick=(e)=>{ e.stopPropagation(); diagnoseItem(g); };
    row.querySelector('[data-act="print"]').onclick=(e)=>{ e.stopPropagation(); openPrintView([g]); };
    row.querySelector('[data-act="txt"]').onclick=(e)=>{
      e.stopPropagation();
      downloadTextFile(buildDueListText([g]), (g.itemTitle||"bai").replace(/[^\p{L}\p{N}]+/gu,"-").slice(0,40));
    };
    row.onclick=()=>startSession(g.words, g.itemTitle);
    wrap.appendChild(row);
  });
}
function escHtml(s){ return String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }

$("#reviewAllBtn").onclick=()=>{
  const seen=new Set(), words=[];
  groups.forEach(g=>g.words.forEach(w=>{ if(!seen.has(w.id)){ seen.add(w.id); words.push(w); } }));
  startSession(words,"Tất cả hôm nay");
};

/* ---------- Tải danh sách từ cần ôn hôm nay (để in / đưa cho AI khác) ---------- */
// Chuyển nội dung "Cách dùng/nghĩa" (HTML có thể có số thứ tự, gạch đầu dòng, xuống dòng)
// sang chữ thường nhưng VẪN GIỮ ĐÚNG cấu trúc đó — không gộp hết thành 1 dòng liền.
function htmlToPlainText(html){
  if(!html) return "";
  const root=document.createElement("div"); root.innerHTML=html;
  const lines=[];
  function walk(node,olCounters){
    if(node.nodeType===3){ // text node
      const t=node.nodeValue.replace(/\s+/g," ");
      if(t.trim()) lines.push({text:t,inline:true});
      return;
    }
    if(node.nodeType!==1) return;
    const tag=node.tagName.toLowerCase();
    if(tag==="br"){ lines.push({text:"",br:true}); return; }
    if(tag==="ol"){
      let n=0;
      [...node.children].forEach(li=>{
        if(li.tagName&&li.tagName.toLowerCase()==="li"){
          n++;
          lines.push({text:n+". "+(li.textContent||"").replace(/\s+/g," ").trim(),block:true});
        }
      });
      return;
    }
    if(tag==="ul"){
      [...node.children].forEach(li=>{
        if(li.tagName&&li.tagName.toLowerCase()==="li"){
          lines.push({text:"• "+(li.textContent||"").replace(/\s+/g," ").trim(),block:true});
        }
      });
      return;
    }
    if(tag==="li"){ lines.push({text:(node.textContent||"").replace(/\s+/g," ").trim(),block:true}); return; }
    const isBlock=["p","div","h1","h2","h3","h4"].includes(tag);
    if(isBlock){
      const txt=(node.textContent||"").replace(/\s+/g," ").trim();
      if(txt) lines.push({text:txt,block:true});
      return;
    }
    [...node.childNodes].forEach(c=>walk(c));
  }
  [...root.childNodes].forEach(c=>walk(c));
  // gộp các dòng "inline" liên tiếp (chữ thường không nằm trong thẻ khối) lại thành 1 dòng
  const out=[]; let buf="";
  lines.forEach(l=>{
    if(l.block){ if(buf.trim()){out.push(buf.trim());buf="";} out.push(l.text); }
    else if(l.br){ if(buf.trim()){out.push(buf.trim());buf="";} }
    else buf+=l.text;
  });
  if(buf.trim()) out.push(buf.trim());
  return out.join("\n   ");
}
function buildDueListText(theGroups){
  const today=new Date();
  const dateStr=String(today.getDate()).padStart(2,"0")+"/"+String(today.getMonth()+1).padStart(2,"0")+"/"+today.getFullYear();
  const seen=new Set(); let totalWords=0;
  theGroups.forEach(g=>g.words.forEach(w=>{ if(!seen.has(w.id)){ seen.add(w.id); totalWords++; } }));
  const LINE="════════════════════════════════════";
  let out=`📚 DANH SÁCH TỪ VỰNG CẦN ÔN — ${dateStr}\n`;
  out+=`Tổng: ${totalWords} từ, ${theGroups.length} bài\n\n`;
  theGroups.forEach(g=>{
    out+=LINE+"\n";
    out+=`${APP_ICON[g.app]||"🗂"} ${g.itemTitle} — ${g.words.length} từ\n`;
    out+=LINE+"\n";
    g.words.forEach((w,i)=>{
      const pinyin=w.pinyin?` (${w.pinyin})`:"";
      out+=`${i+1}. ${w.word}${pinyin}\n`;
      const meaning=htmlToPlainText(w.content);
      out+= meaning ? `   Nghĩa/cách dùng: ${meaning}\n` : `   (chưa ghi nghĩa/cách dùng)\n`;
    });
    out+="\n";
  });
  out+="---\n";
  out+=`Ghi chú: đây là danh sách từ vựng cần ôn hôm nay, xuất từ app "🔁 Ôn tập từ vựng" (汉学). `;
  out+=`Có thể dùng để in ra học offline, hoặc dán vào AI khác (ChatGPT, Gemini...) nhờ tạo thêm bài tập đa dạng để ôn luyện.\n`;
  return out;
}
function downloadTextFile(text,fnameSuffix){
  const blob=new Blob([text],{type:"text/plain;charset=utf-8"});
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a");
  const today=new Date();
  const datePart=today.getFullYear()+"-"+String(today.getMonth()+1).padStart(2,"0")+"-"+String(today.getDate()).padStart(2,"0");
  a.href=url; a.download="on-tap-tu-vung-"+datePart+(fnameSuffix?"-"+fnameSuffix:"")+".txt";
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(url),1000);
}
$("#downloadListBtn").onclick=()=>{
  downloadTextFile(buildDueListText(groups),"tat-ca");
};

/* ---------- Xem/in bản CÓ MÀU — giữ nguyên đúng màu nền/chữ/đậm/số thứ tự như thẻ từ gốc ---------- */
// Mở thẳng ra 1 tab mới để xem/in ngay (không tải file .txt phẳng như trên) — dùng đúng
// wordStyleCSS() từ shared-vocab.js nên màu sắc/định dạng y hệt app, và giữ nguyên HTML gốc
// của phần "Cách dùng/nghĩa" (số thứ tự, gạch đầu dòng, chữ tô màu bên trong ví dụ...).
function buildDueListHTML(theGroups){
  const today=new Date();
  const dateStr=String(today.getDate()).padStart(2,"0")+"/"+String(today.getMonth()+1).padStart(2,"0")+"/"+today.getFullYear();
  const seen=new Set(); let totalWords=0;
  theGroups.forEach(g=>g.words.forEach(w=>{ if(!seen.has(w.id)){ seen.add(w.id); totalWords++; } }));
  let body="";
  theGroups.forEach(g=>{
    body+=`<div class="grp-title">${APP_ICON[g.app]||"🗂"} ${escHtml(g.itemTitle)} — ${g.words.length} từ</div>`;
    g.words.forEach(w=>{
      const wcss=(typeof wordStyleCSS==="function")?wordStyleCSS(w):"";
      const content=w.content||"<span class='no-content'>(chưa ghi nghĩa/cách dùng)</span>";
      body+=`<div class="word-card">
        <div class="word-chip" style="${wcss}">${escHtml(w.word)}</div>
        <div class="content-label">Cách dùng, ví dụ, nghĩa…</div>
        <div class="content-body">${content}</div>
      </div>`;
    });
  });
  return `<!DOCTYPE html><html lang="vi"><head><meta charset="UTF-8">
<title>Ôn tập từ vựng — ${dateStr}</title>
<style>
body{font-family:'Quicksand',system-ui,sans-serif;background:#f7f3e8;color:#2a2722;margin:0;padding:24px;max-width:760px;margin:0 auto}
h1{font-size:20px;margin-bottom:2px}
.sub{color:#6b655b;font-size:13px;margin-bottom:22px}
.grp-title{font-weight:700;font-size:15px;margin:26px 0 12px;padding-bottom:6px;border-bottom:2px solid #e4dfd2;color:#1e2d21}
.word-card{background:#fff;border:1.5px solid #e4dfd2;border-radius:16px;padding:0;margin-bottom:16px;overflow:hidden;box-shadow:0 4px 16px rgba(44,60,44,.08);break-inside:avoid}
.word-chip{font-family:'KaiTi','楷体',serif;font-size:30px;padding:16px 20px;background:#fff3a3}
.content-label{color:#a39d8f;font-size:12px;padding:12px 20px 0}
.content-body{padding:6px 20px 18px;font-size:14.5px;line-height:1.6}
.content-body ol,.content-body ul{margin:6px 0;padding-left:22px}
.content-body li{margin:4px 0}
.no-content{color:#a39d8f;font-style:italic}
.tip{background:#fbf6e3;border:1px dashed #d8cfa8;border-radius:10px;padding:10px 14px;font-size:12.5px;color:#6b655b;margin-bottom:20px}
@media print{ body{background:#fff} .tip{display:none} .word-card{box-shadow:none} }
</style></head><body>
<h1>📚 Ôn tập từ vựng — ${dateStr}</h1>
<div class="sub">Tổng: ${totalWords} từ, ${theGroups.length} bài</div>
<div class="tip">💡 Muốn in ra: bấm Ctrl+P → nhớ bật "In hình nền" / "Background graphics" để giữ đúng màu sắc khi in.</div>
${body}
</body></html>`;
}
function openPrintView(theGroups){
  const html=buildDueListHTML(theGroups);
  const blob=new Blob([html],{type:"text/html;charset=utf-8"});
  const url=URL.createObjectURL(blob);
  window.open(url,"_blank");
  setTimeout(()=>URL.revokeObjectURL(url),60000);
}
$("#printViewBtn").onclick=()=>openPrintView(groups);

/* ---------- Chẩn đoán chi tiết 1 bài — tìm hiểu vì sao số từ hiện ra ít hơn thực tế ---------- */
function diagnoseItem(g){
  const totalInBank=bank.filter(v=>v&&v.word).length;
  // Tất cả từ có ÍT NHẤT 1 occurrence với TIÊU ĐỀ giống bài này (bất kể itemId có khớp hay không)
  const byTitle=bank.filter(v=>v&&v.word&&Array.isArray(v.occurrences)&&v.occurrences.some(o=>o&&o.itemTitle===g.itemTitle));
  // Trong số đó, từ nào có occurrence KHỚP ĐÚNG itemId đang dùng cho bài này
  const byIdMatch=byTitle.filter(v=>v.occurrences.some(o=>o&&o.itemTitle===g.itemTitle&&o.itemId===g.itemId));
  // Từ có tiêu đề khớp nhưng itemId KHÔNG khớp bất kỳ occurrence nào (nghi ngờ bị lệch id)
  const idMismatch=byTitle.filter(v=>!v.occurrences.some(o=>o&&o.itemTitle===g.itemTitle&&o.itemId===g.itemId));
  // Trong số từ khớp đúng id, từ nào KHÔNG "đến hạn" (đã có lịch ôn tương lai) nên bị loại khỏi danh sách hôm nay
  const notDue=byIdMatch.filter(v=>!vocabIsDue(v));

  let msg=`🔍 Chẩn đoán cho bài: ${g.itemTitle}\n\n`;
  msg+=`Tổng số từ trong CẢ KHO: ${totalInBank}\n`;
  msg+=`Số từ có TIÊU ĐỀ bài khớp (bất kể id): ${byTitle.length}\n`;
  msg+=`  - Trong đó khớp ĐÚNG id đang hiện ở đây: ${byIdMatch.length}\n`;
  msg+=`  - Trong đó bị LỆCH id (tiêu đề đúng nhưng id khác — nghi ngờ đây là nguyên nhân thiếu từ): ${idMismatch.length}\n`;
  msg+=`Trong số khớp đúng id, số từ ĐÃ ôn (có lịch tương lai, không tính "đến hạn hôm nay"): ${notDue.length}\n`;
  msg+=`\n=> Số hiện đang đếm là "đến hạn": ${g.words.length}\n`;
  if(idMismatch.length){
    msg+=`\n⚠️ Danh sách từ bị LỆCH ID (có thể là nguyên nhân):\n`;
    idMismatch.slice(0,15).forEach(v=>{ msg+=`- ${v.word}\n`; });
    if(idMismatch.length>15) msg+=`... và ${idMismatch.length-15} từ khác\n`;
  }
  if(notDue.length){
    msg+=`\n📅 Từ đã có lịch ôn tương lai (không phải thiếu, chỉ là chưa đến hạn hôm nay):\n`;
    notDue.slice(0,15).forEach(v=>{ msg+=`- ${v.word}\n`; });
  }
  alert(msg);
  console.log("Chẩn đoán chi tiết:",{g,totalInBank,byTitle,byIdMatch,idMismatch,notDue});
}
function startSession(words,title){
  const shuffled=words.slice().sort(()=>Math.random()-0.5);
  session={words:shuffled, idx:0, correct:0, wrong:[], title};
  $("#homeView").classList.add("hidden");
  $("#resultView").classList.add("hidden");
  $("#reviewView").classList.remove("hidden");
  $("#sessionTitle").textContent=title;
  nextQuestion();
}
$("#exitBtn").onclick=()=>{ session=null; $("#reviewView").classList.add("hidden"); renderHome(); $("#homeView").classList.remove("hidden"); };
$("#backHomeBtn").onclick=()=>{ $("#resultView").classList.add("hidden"); renderHome(); $("#homeView").classList.remove("hidden"); };

function nextQuestion(){
  if(!session) return;
  if(session.idx>=session.words.length){ finishSession(); return; }
  const word=session.words[session.idx];
  const pct=Math.round((session.idx)/session.words.length*100);
  $("#progFill").style.width=pct+"%";
  $("#progTxt").textContent=`Câu ${session.idx+1}/${session.words.length}`;
  let q=vocabGenQuestion(word,bank);
  if(!q){
    // từ chưa có nghĩa -> bỏ qua, không tính là sai, chỉ nhắc bổ sung
    session.idx++;
    nextQuestion();
    return;
  }
  session.curQuestion=q;
  renderQuestion(q);
}

function renderQuestion(q){
  const c=$("#qcard"); c.innerHTML="";
  if(q.type==="meaning_choice"){
    c.innerHTML=`<div class="han-big">${escHtml(q.promptHan)}</div><div class="hint">Chọn đúng nghĩa</div>
      <div class="options" id="optWrap"></div>`;
    buildChoiceOptions(q,false);
  } else if(q.type==="word_choice"){
    c.innerHTML=`<div class="meaning-big">${escHtml(q.promptMeaning)}</div><div class="hint">Chọn đúng chữ Hán</div>
      <div class="options" id="optWrap"></div>`;
    buildChoiceOptions(q,true);
  } else if(q.type==="listen_choice"){
    c.innerHTML=`<button class="speak-btn" id="speakBtn">🔊</button><div class="hint">Nghe rồi chọn đúng chữ Hán</div>
      <div class="options" id="optWrap"></div>`;
    $("#speakBtn").onclick=()=>speak(q.speak);
    buildChoiceOptions(q,true);
    speak(q.speak);
  } else if(q.type==="true_false"){
    c.innerHTML=`<div class="han-big">${escHtml(q.promptHan)}</div>
      <div class="meaning-big">${escHtml(q.shown)}</div>
      <div class="hint">Cặp chữ + nghĩa này đúng hay sai?</div>
      <div class="tf-row"><button id="btnTrue">✅ Đúng</button><button id="btnFalse">❌ Sai</button></div>`;
    $("#btnTrue").onclick=()=>answerTF(true);
    $("#btnFalse").onclick=()=>answerTF(false);
  } else if(q.type==="type_answer"){
    c.innerHTML=`<div class="meaning-big">${escHtml(q.promptMeaning)}</div><div class="hint">Gõ đúng chữ Hán</div>
      <input type="text" id="typeInput" autocomplete="off" autocapitalize="off">
      <button class="btn btn-main" id="submitTypeBtn" style="margin-top:10px">Kiểm tra</button>`;
    $("#typeInput").focus();
    $("#typeInput").addEventListener("keydown",e=>{ if(e.key==="Enter") submitType(); });
    $("#submitTypeBtn").onclick=submitType;
  }
}

function buildChoiceOptions(q,isHan){
  const wrap=$("#optWrap");
  q.options.forEach((opt,i)=>{
    const b=document.createElement("button");
    b.className="opt-btn"+(isHan?"":" meaning");
    b.textContent=opt;
    b.onclick=()=>answerChoice(i,b,wrap);
    wrap.appendChild(b);
  });
}
function answerChoice(i,btn,wrap){
  const q=session.curQuestion;
  const correct=vocabGradeAnswer(q,i);
  [...wrap.children].forEach((b,idx)=>{
    b.onclick=null;
    if(idx===q.correctIndex) b.classList.add("correct");
    else if(idx===i) b.classList.add("wrong");
  });
  finishAnswer(correct);
}
function answerTF(val){
  const q=session.curQuestion;
  const correct=vocabGradeAnswer(q,val);
  finishAnswer(correct);
}
function submitType(){
  const q=session.curQuestion;
  const val=$("#typeInput").value;
  const correct=vocabGradeAnswer(q,val);
  $("#typeInput").disabled=true;
  finishAnswer(correct,val);
}
function speak(text){
  try{
    if(!window.speechSynthesis) return;
    speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(text);
    u.lang="zh-CN";
    speechSynthesis.speak(u);
  }catch(e){}
}

function finishAnswer(correct,typedVal){
  const q=session.curQuestion;
  vocabRescheduleAfterAnswer(q.word,correct);
  saveBank();
  if(correct) session.correct++; else session.wrong.push(q.word);
  const c=$("#qcard");
  const fb=document.createElement("div");
  fb.className="feedback "+(correct?"ok":"no");
  if(correct) fb.textContent="✅ Chính xác!";
  else{
    let ans=q.answer!==undefined?q.answer:(q.options?q.options[q.correctIndex]:(q.isTrue?"Đúng":"Sai"));
    fb.textContent="❌ Chưa đúng — đáp án: "+ans;
  }
  c.appendChild(fb);
  const nb=document.createElement("button");
  nb.className="btn btn-main next-btn"; nb.textContent="Câu tiếp theo →";
  nb.onclick=()=>{ session.idx++; nextQuestion(); };
  c.appendChild(nb);
}

function finishSession(){
  $("#reviewView").classList.add("hidden");
  $("#resultView").classList.remove("hidden");
  const total=session.words.length;
  $("#resultScore").textContent=session.correct+"/"+total;
  const pct=total?Math.round(session.correct/total*100):100;
  let desc="Làm rất tốt! 🎉";
  if(pct<50) desc="Cần ôn lại nhiều hơn — mấy từ sai sẽ tự hẹn ôn lại sớm.";
  else if(pct<80) desc="Khá tốt — mấy từ sai đã tự hẹn ôn lại sớm hơn.";
  $("#resultDesc").textContent=desc;
  session=null;
}

renderHome();

// Kiểm tra "kho lớn" (IndexedDB) — nếu có nhiều từ hơn bản đang đọc từ bộ nhớ trình duyệt
// thường (dấu hiệu bộ nhớ thường từng lưu thiếu do đầy), tự động gộp bổ sung và render lại,
// không cần bạn phải tự khôi phục thủ công.
if(typeof vocabBankAutoHeal==="function"){
  vocabBankAutoHeal(bank,(healed,added)=>{
    bank=healed; saveBank(); renderHome();
    const msg=document.createElement("div");
    msg.style.cssText="position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#1e2d21;color:#fff;padding:10px 18px;border-radius:10px;font-size:13px;z-index:999";
    msg.textContent=`✅ Đã tự khôi phục ${added} thẻ từ bị thiếu từ bản dự phòng.`;
    document.body.appendChild(msg);
    setTimeout(()=>msg.remove(),4000);
  });
}
